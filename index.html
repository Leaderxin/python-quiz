USER appuser`。"}, {"qid": "d046q5", "type": "code", "stem": "写一个函数 `is_cache_friendly(lines)`，判断 Dockerfile 的 COPY 顺序是否有利于缓存。`lines` 是指令行列表；只处理 `COPY` 行（形如 `COPY 源... 目标`），依赖清单文件名集合为 `{\"requirements.txt\", \"pyproject.toml\", \"uv.lock\", \"package.json\"}`，源码目录以 `src/` 开头的算源码行。当依赖清单行的位置早于源码行时返回 `True`，任一缺失或顺序相反返回 `False`。", "answer": "DEPS = {\"requirements.txt\", \"pyproject.toml\", \"uv.lock\", \"package.json\"}\n\n\ndef is_cache_friendly(lines):\n    deps_at = src_at = None\n    for i, line in enumerate(lines):\n        parts = line.strip().split()\n        if len(parts) < 3 or parts[0].upper() != \"COPY\":\n            continue\n        for src in parts[1:-1]:\n            if src in DEPS:\n                deps_at = i\n            elif src.startswith(\"src/\"):\n                src_at = i\n    return deps_at is not None and src_at is not None and deps_at < src_at", "explain": "判分要点：只认 COPY 行（其他指令与注释跳过）；目标路径是最后一个参数，源是中间参数，因此不能拿整行最后一个 token 去比；依赖行下标必须严格小于源码行下标。"}], "47": [{"qid": "d047q1", "type": "single", "stem": "按快速失败原则，下面哪种门禁顺序最合理？", "options": ["A  构建镜像 → 集成测试 → 格式检查 → 单元测试", "B  格式与静态检查 → 类型检查 → 单元测试 → 构建镜像 → 集成测试", "C  部署到预发 → 单元测试 → 类型检查", "D  类型检查 → 部署到生产 → 单元测试"], "answer": "B", "explain": "便宜且定位明确的检查放最前，几秒内就能拦下格式与类型错误；构建与集成测试最贵放最后。部署永远在全部检查通过之后。"}, {"qid": "d047q2", "type": "single", "stem": "为了让线上出问题时能快速回滚，发布流程应当满足哪一条？", "options": ["A  每次都覆盖 latest 标签，回滚时重新拉最新的镜像", "B  每次构建产出带唯一版本号（如提交号）的不可变镜像，回滚即部署上一个版本", "C  回滚时在服务器上直接改代码再重启进程", "D  回滚由运维手工操作，不需要记录当前运行版本"], "answer": "B", "explain": "不可变且带唯一版本号的制品让“上一个良好版本”是确定的、可复现的。覆盖 latest 或现场改代码都会让回滚结果不可预期。"}, {"qid": "d047q3", "type": "judge", "stem": "告警应当尽量覆盖每一个内部原因（例如每类异常都单独配一条告警），这样定位问题最快。", "answer": false, "explain": "内部原因数量庞大且经常变化，逐条告警会产生大量噪音。应按用户可见症状（错误率、P95 延迟、成功率）告警，再借 trace_id 与日志下钻到具体原因。"}, {"qid": "d047q4", "type": "fill", "stem": "把一次请求跨多个服务的调用过程串联起来、用于定位耗时在哪个环节的可观测性手段叫分布式 ____（填中文词或英文词均可）。", "answer": ["追踪", "链路追踪", "tracing", "trace", "distributed tracing"], "explain": "分布式追踪用 trace 与 span 描述单次请求的调用树，与日志的 trace_id 关联后即可从指标异常下钻到具体一跳。"}, {"qid": "d047q5", "type": "code", "stem": "写一个发布门禁函数 `release_gate(metrics)`。`metrics` 形如 `{\"total\": 200, \"errors\": 3, \"p95_ms\": 480, \"last_release_p95_ms\": 400}`。规则：`total` 为 0 时返回 `\"PASS\"`；错误率严格大于 1% 返回 `\"BLOCK\"`；`p95_ms` 严格大于上次发布 p95 的 1.5 倍返回 `\"BLOCK\"`；否则返回 `\"PASS\"`。只用标准库。", "answer": "def release_gate(metrics):\n    total = metrics[\"total\"]\n    if total == 0:\n        return \"PASS\"\n    if metrics[\"errors\"] / total > 0.01:\n        return \"BLOCK\"\n    if metrics[\"p95_ms\"] > 1.5 * metrics[\"last_release_p95_ms\"]:\n        return \"BLOCK\"\n    return \"PASS\"", "explain": "判分要点：先处理 `total == 0` 以避免除零；错误率用除法而不是比较绝对数；阈值判断用严格大于，避免恰好命中阈值就被拦下。"}], "48": [{"qid": "d048q1", "type": "single", "stem": "某服务的业务层需要把折扣规则测试到位，同时还要连仓储读数据。为了让规则测试既快又稳定，最合适的做法是？", "options": ["A  在测试中启动真实数据库，等数据准备好再断言折扣结果", "B  把仓储与时钟作为构造参数注入业务层，规则测试传入内存假实现与固定时钟", "C  把折扣规则复制一份到测试文件里单独验证副本", "D  用 sleep 等待异步任务结束后再断言"], "answer": "B", "explain": "依赖注入把外部依赖变成可替换的入参，规则测试因此不碰数据库、不依赖真实时间。复制代码验证副本则会与实现漂移。"}, {"qid": "d048q2", "type": "single", "stem": "接口压测显示 P95 延迟随并发明显上升，应用 CPU 使用率仅 20%，数据库连接池常年打满，且“等待获取连接”占了请求耗时的 80%。最应优先处理的是什么？", "options": ["A  增加应用实例的 CPU 核数", "B  减少单请求的数据库往返（消除 N+1）并在评估连接数上限后合理调整连接池", "C  换用性能更高的编程语言重写接口", "D  把客户端超时调短，掩盖等待时间"], "answer": "B", "explain": "CPU 空闲而大部分时间在等连接，瓶颈是数据库访问次数与连接并发度，不是算力。减少查询往返、消除 N+1 并合理扩容连接池才对症；缩超时只是掩盖。"}, {"qid": "d048q3", "type": "judge", "stem": "在 async 函数里直接调用阻塞式的同步 HTTP 客户端会卡住事件循环，应改用异步客户端或把调用放进线程池。", "answer": true, "explain": "事件循环是单线程协作式调度，阻塞调用期间其他任务无法推进，延迟会整体抬升。异步客户端或 `to_thread` 把阻塞转移出去。"}, {"qid": "d048q4", "type": "fill", "stem": "`LIMIT/OFFSET` 深分页越翻越慢，改成用上一页最后一条记录的排序键继续向后取，这种方式叫 ____ 分页（填中文词或英文词均可）。", "answer": ["游标", "游标分页", "cursor", "cursor-based", "keyset"], "explain": "游标（keyset）分页把 `OFFSET n` 换成“排序键大于上一页末值”的条件，数据库可沿索引直接定位，代价与页码无关。"}, {"qid": "d048q5", "type": "code", "stem": "写一个游标分页函数 `next_page(records, cursor, size)`：`records` 是按 `id` 升序排列的字典列表；从 `id` 大于 `cursor` 的记录开始取至多 `size` 条（`cursor` 为 `None` 时从头开始）；返回 `(page, next_cursor)` 二元组，`next_cursor` 是本页最后一条的 `id`，本页为空时返回 `None`。只用标准库。", "answer": "def next_page(records, cursor, size):\n    remaining = [r for r in records if cursor is None or r[\"id\"] > cursor]\n    page = remaining[:size]\n    next_cursor = page[-1][\"id\"] if page else None\n    return page, next_cursor", "explain": "判分要点：严格用 `>` 而不是 `>=`，否则会重复返回上一页最后一条；取满 `size` 条上限；空页时游标为 `None` 而不是报错或返回上一页的值。"}]}, "today": "2026-10-30", "default_day": 15, "generated_at": "2026-10-30 07:55", "total": 48};
const TYPE_NAME = {single:'单选', judge:'判断', fill:'填空', code:'代码'};
let t0 = Date.now(), tick = null, submitted = false;
const $ = s => document.querySelector(s);
function fmt(ms){const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function startTimer(){clearInterval(tick);t0=Date.now();tick=setInterval(()=>{$('#timer').textContent=fmt(Date.now()-t0)},1000)}
function initSelect(sel){const s=$('#daySel');s.innerHTML=DATA.meta.map(m=>`<option value="${m.day}">第${String(m.day).padStart(2,'0')}期 · ${m.weekday} · ${m.date} · ${m.title}</option>`).join('');s.value=sel}
function loadDay(day){
  submitted=false; localStorage.setItem('pyqz_last', day);
  const m=DATA.meta.find(x=>x.day==day);
  $('#titleBox').textContent = `W${m.week}｜${m.date} ${m.weekday}${m.review?'｜本周综合测':''}｜${m.theme}`;
  const area=$('#quizArea'); area.innerHTML='';
  DATA.quiz[String(day)].forEach((q,i)=>{
    const d=document.createElement('div'); d.className='q';
    let body='';
    if(q.type==='single') body=q.options.map(o=>`<label class="opt"><input type="radio" name="q${i}" value="${esc(o.trim()[0])}">${esc(o)}</label>`).join('');
    else if(q.type==='judge') body='<label class="opt"><input type="radio" name="q'+i+'" value="true">对</label><label class="opt"><input type="radio" name="q'+i+'" value="false">错</label>';
    else if(q.type==='fill') body='<input type="text" name="q'+i+'" placeholder="填写答案" style="width:100%">';
    else body='<textarea name="q'+i+'" placeholder="在此写代码（3–8 行即可）"></textarea>';
    d.innerHTML=`<h3><span class="tag">${TYPE_NAME[q.type]}</span>第 ${i+1} 题</h3><p class="stem">${esc(q.stem)}</p>${body}<div class="res hide" id="r${i}"></div>`;
    area.appendChild(d);
  });
  $('#summary').className='sum hide'; $('#summary').innerHTML='';
  $('#footNote').textContent=`题库生成于 ${DATA.generated_at}｜共 ${DATA.total} 期 ${DATA.total*5} 题｜离线打开也能判客观题；由本地服务打开时会自动记入飞书记录表`;
  startTimer();
}
function answerOf(i){
  const q=DATA.quiz[String($('#daySel').value)][i];
  if(q.type==='fill'||q.type==='code'){const el=document.querySelector('[name=q'+i+']');return el?el.value.trim():''}
  const el=document.querySelector('input[name=q'+i+']:checked'); return el?el.value:'';
}
function gradeLocal(q,a){
  if(!a) return false;
  if(q.type==='single') return String(a).toUpperCase()===q.answer;
  if(q.type==='judge') return String(a)===String(q.answer);
  if(q.type==='fill') return (q.answer||[]).map(s=>String(s).trim().toLowerCase()).includes(String(a).trim().toLowerCase());
  return null;
}
function renderResult(day, qs, answers, cor, tot, elapsed){
  const pct = tot?Math.round(100*cor/tot):0;
  $('#summary').className='sum';
  $('#summary').innerHTML=`<div class="score">${cor}/${tot}　<span style="font-size:16px;color:#6b7280">客观题正确率 ${pct}%</span></div>
    <div class="muted">第 ${day} 期 · 用时 ${fmt(elapsed*1000)}${answers[5]?' · 代码题已作答':' · 代码题未作答'}</div>
    <table><tr><th>题号</th><th>类型</th><th>你的答案</th><th>结果</th></tr>
    ${qs.map((q,i)=>{const a=answers[i+1]||'';const g=gradeLocal(q,a);
      return `<tr><td>${i+1}</td><td>${TYPE_NAME[q.type]}</td><td>${esc(a).slice(0,40)||'—'}</td><td>${q.type==='code'?'待评':(g?'✅':'❌')}</td></tr>`}).join('')}</table>
    <div style="margin-top:10px"><button class="primary" id="btnCopy">复制上报文本</button>
      <button class="ghost" id="btnNext">下一期</button> <span id="postMsg" class="muted"></span></div>`;
  $('#btnCopy').onclick=()=>{
    const t=`PYQZ day=${day} 客观题=${cor}/${tot} 用时=${elapsed}s ${answers[5]?'代码题已作答':'代码题未作答'}
作答：${qs.map((q,i)=>`${i+1}.${answers[i+1]||'（未答）'}`).join('  ')}`;
    navigator.clipboard.writeText(t).then(()=>$('#postMsg').textContent='已复制，粘贴回飞书即可入库',()=>{$('#postMsg').textContent=t});
  };
  $('#btnNext').onclick=()=>{const n=Math.min(DATA.total, day+1); $('#daySel').value=n; loadDay(n)};
}
async function submit(){
  if(submitted) return; submitted=true; clearInterval(tick);
  const day=+$('#daySel').value, qs=DATA.quiz[String(day)], elapsed=Math.round((Date.now()-t0)/1000);
  let cor=0, tot=0; const answers={};
  qs.forEach((q,i)=>{
    const a=answerOf(i); answers[i+1]=a; const r=$('#r'+i); r.className='res';
    if(q.type==='code'){
      r.classList.add(a?'ok':'bad');
      r.innerHTML=`<b>参考实现</b><pre>${esc(q.answer)}</pre><b>判分要点</b><div>${esc(q.explain)}</div>
        <div class="muted">${a?'你的作答已记录，可交回 Hermes 对照判分。':'未作答。'}</div>`;
    } else {
      const ok=gradeLocal(q,a); tot++; if(ok) cor++;
      r.classList.add(ok?'ok':'bad');
      r.innerHTML=(ok?'✅ 正确':'❌ 错误')+`（正确答案：${q.type==='judge'?(q.answer?'对':'错'):esc(q.answer)}）<div>${q.explain}</div>`;
    }
  });
  renderResult(day, qs, answers, cor, tot, elapsed);
  const hist=JSON.parse(localStorage.getItem('pyqz_hist')||'[]');
  hist.push({day, ts:new Date().toISOString(), cor, tot, elapsed, answers});
  localStorage.setItem('pyqz_hist', JSON.stringify(hist));
  if(DATA.server === false){                       // 纯静态部署（如 GitHub Pages）：不做提交，只给复制上报
    $('#postMsg').textContent='点「复制上报文本」粘回飞书，由 Hermes 判卷入库';
    return;
  }
  try{
    const r=await fetch('submit',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({day, answers, elapsed, objective_correct:cor, objective_total:tot,
                           code_answered:!!answers[5], code:answers[5]||''})});
    if(r.ok){const j=await r.json(); $('#postMsg').textContent = j.recorded ? `已自动记入学习记录（第 ${day} 期，累计 ${j.total_done} 期）` : (j.message||'未入库');}
    else throw new Error('bad status');
  }catch(e){ $('#postMsg').textContent='离线模式：请复制上报文本发回飞书，由 Hermes 入库'; }
}
$('#btnSubmit').onclick=submit;
$('#btnReset').onclick=()=>loadDay(+$('#daySel').value);
$('#daySel').onchange=e=>loadDay(+e.target.value);
(function(){ const last=+localStorage.getItem('pyqz_last')||DATA.default_day; initSelect(last); loadDay(last); })();
</script></body></html>
