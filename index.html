02", "weekday": "周三", "title": "期末综合测：完整交付复盘", "theme": "服务化、交付与收口", "review": true}], "quiz": {"1": [{"qid": "d001q1", "type": "single", "stem": "执行以下代码后输出是什么？\n\n```python\na = [1, 2]\nb = a\nb += [3]\nprint(a, b)\n```", "options": ["A  [1, 2] [1, 2, 3]", "B  [1, 2, 3] [1, 2, 3]", "C  [1, 2, 3] [1, 2]", "D  抛出异常"], "answer": "B", "explain": "`b = a` 让两个名字指向同一个 list。`b += [3]` 对 list 是原地扩展（等价 extend），没有重新绑定，所以 a 与 b 都看到变化。"}, {"qid": "d001q2", "type": "single", "stem": "下面哪一句最适合判断变量 x 是否为 None？", "options": ["A  if x == None:", "B  if x is None:", "C  if not x:", "D  if type(x) == NoneType:"], "answer": "B", "explain": "None 是单例，身份判断最准确且不会被自定义 `__eq__` 干扰。`not x` 会把 0、''、[] 等假值也判为真，语义不同。"}, {"qid": "d001q3", "type": "judge", "stem": "Python 的赋值 `b = a` 会复制一份 a 的数据，之后修改 b 不会影响 a。", "answer": false, "explain": "赋值只把名字绑定到同一对象。要复制需要显式使用 copy 模块（浅拷贝）或 copy.deepcopy（深拷贝）。"}, {"qid": "d001q4", "type": "fill", "stem": "要判断两个名字是否指向同一个对象，应使用运算符 ____（填运算符本身）。", "answer": ["is"], "explain": "`is` 比较对象身份（id 相同），`==` 比较值是否相等。"}, {"qid": "d001q5", "type": "code", "stem": "写一个函数 `append_safe(target, value)`：在 target 末尾追加 value 并返回它，但**不得修改传入的列表**（调用方的列表必须保持原样）。3–5 行即可。", "answer": "def append_safe(target, value):\n    new_list = list(target)      # 复制一份再改\n    new_list.append(value)\n    return new_list", "explain": "判分要点：必须先复制（`list(target)`、`target[:]` 或 `copy.copy`）再 append；直接 `target.append` 会修改调用方数据，扣满分。"}], "2": [{"qid": "d002q1", "type": "single", "stem": "执行以下代码后输出是什么？\n\n```python\ndef add(item, bucket=[]):\n    bucket.append(item)\n    return bucket\n\nprint(add(1), add(2))\n```", "options": ["A  [1] [2]", "B  [1] [1, 2]", "C  [1, 2] [1, 2]", "D  抛出 TypeError"], "answer": "B", "explain": "默认值 bucket=[] 在定义时只创建一次，两次调用共用同一个 list，所以第二次看到上一次追加的 1。要避免就改用 None 作哨兵。"}, {"qid": "d002q2", "type": "single", "stem": "执行以下代码后输出是什么？\n\n```python\nimport copy\na = [[1, 2], [3, 4]]\nb = copy.copy(a)\nb[0].append(99)\nprint(a)\n```", "options": ["A  [[1, 2], [3, 4]]", "B  [[1, 2, 99], [3, 4]]", "C  [[1, 2, 99], [3, 4, 99]]", "D  [[1, 2], [3, 4, 99]]"], "answer": "B", "explain": "copy.copy 是浅拷贝，只新建外层列表，内层子列表仍与 a 共享；改 b[0] 等于改 a[0]。要彻底隔离需用 copy.deepcopy。"}, {"qid": "d002q3", "type": "judge", "stem": "函数定义 `def f(x, cache={})` 中的 cache 在每次调用 f 时都会重新创建一个空字典。", "answer": false, "explain": "默认参数只在函数定义时求值一次，所有调用共享同一个字典。该字典会跨调用累积数据，正确写法是用 None 作默认值再在函数体内新建。"}, {"qid": "d002q4", "type": "fill", "stem": "要复制嵌套容器内部的子对象、让新旧结构完全独立，应使用 copy 模块的 ____ 函数（填函数名）。", "answer": ["deepcopy"], "explain": "copy.copy 只复制外层一层；copy.deepcopy 递归复制所有层级，代价是更慢，并能处理循环引用。"}, {"qid": "d002q5", "type": "code", "stem": "写一个函数 `add_tag(tag, tags=None)`：把 tag 追加到 tags 的副本末尾并返回该副本（不修改传入的列表）；tags 为 None 时从空列表开始。要求多次调用之间不共享状态。4–6 行。", "answer": "def add_tag(tag, tags=None):\n    new_tags = [] if tags is None else list(tags)\n    new_tags.append(tag)\n    return new_tags", "explain": "判分要点：用 None 作默认值（不能写 tags=[]），并且复制一份再 append（不能原地修改调用方的列表）；返回的是新列表。"}], "3": [{"qid": "d003q1", "type": "single", "stem": "一个类只定义了 `__eq__`，没有定义 `__hash__`。关于它的实例，下列说法正确的是？", "options": ["A  仍然可哈希，哈希值按属性计算", "B  `__hash__` 被置为 None，放入 set 或作 dict 键时抛 TypeError", "C  无法再创建实例，实例化时抛 TypeError", "D  仍可哈希，哈希值等于 id()"], "answer": "B", "explain": "Python 认为定义了相等语义的类型必须同时定义哈希，因此把 `__hash__` 设为 None，实例变为不可哈希；需要显式实现 `__hash__`。"}, {"qid": "d003q2", "type": "single", "stem": "关于相等与哈希的关系，下列哪一条是必须成立的？", "options": ["A  两个对象的哈希值相同，它们就必须相等", "B  两个对象相等，它们的哈希值就必须相同", "C  哈希值不同时，两个对象仍可能相等", "D  `__eq__` 返回 True 说明两个名字指向同一个对象"], "answer": "B", "explain": "哈希碰撞允许不同对象哈希相同（A 错）；哈希不同就必然不相等（C 错）；`__eq__` 比的是值，与身份无关（D 错）。"}, {"qid": "d003q3", "type": "judge", "stem": "list 和 dict 都可以直接作为字典的键（key）使用。", "answer": false, "explain": "两者都是可变且未实现 `__hash__`，属于不可哈希类型，做键会抛 TypeError: unhashable type。可用 tuple 或 frozenset 代替。"}, {"qid": "d003q4", "type": "fill", "stem": "自定义类的实例要放进 set 或作为字典的键，除了 `__eq__`（相等契约）外还应当实现 ____ 方法（填方法名）。", "answer": ["__hash__"], "explain": "set/dict 先用 `__hash__` 定位桶，再用 `__eq__` 确认命中，两者必须自洽：相等对象的哈希值必须相同。"}, {"qid": "d003q5", "type": "code", "stem": "定义一个不可变的值对象类 `Money`，含 `amount`（int）与 `currency`（str）两个字段，使字段相同的实例相等且能放进 set（哈希按字段计算）。可用标准库 dataclasses，3–6 行。", "answer": "from dataclasses import dataclass\n\n@dataclass(frozen=True)\nclass Money:\n    amount: int\n    currency: str", "explain": "判分要点：frozen=True 才会同时生成 `__eq__` 与 `__hash__`（只写 @dataclass 时 `__hash__` 被置为 None）。手写则需同时实现这两个方法。"}], "4": [{"qid": "d004q1", "type": "single", "stem": "设 lst 是长度为 n 的 list，下列操作中平均复杂度为 O(n)（代价随 n 线性增长）的是？", "options": ["A  lst[i] 按下标取值", "B  lst.append(x) 尾部追加", "C  lst.insert(0, x) 头部插入", "D  len(lst) 取长度"], "answer": "C", "explain": "在头部插入要把后面 n 个元素整体后移，是 O(n)。按下标取值、尾部追加（摊销）、len 都是 O(1)。"}, {"qid": "d004q2", "type": "single", "stem": "需要反复判断某个名字是否出现在一个含十万条记录的集合中，下面哪种容器最合适？", "options": ["A  list", "B  tuple", "C  set", "D  dict 的 values() 视图"], "answer": "C", "explain": "set 的成员判断平均 O(1)；list 与 tuple 是 O(n)，dict 的 values() 视图做成员判断同样是线性扫描，并没有 O(1) 的键查找。"}, {"qid": "d004q3", "type": "judge", "stem": "Python 的 dict 在迭代时按键值大小排序输出，所以遍历结果总是升序的。", "answer": false, "explain": "dict 保证的是按插入顺序迭代（Python 3.7 起为语言规范），不是排序。需要有序输出必须显式 sorted(d.items())。"}, {"qid": "d004q4", "type": "fill", "stem": "需要在序列两端频繁插入和删除时，应使用 collections 模块中的 ____ 类型，它两端操作的复杂度都是 O(1)。", "answer": ["deque"], "explain": "list 头部操作是 O(n)；collections.deque 两端 append/pop 都是 O(1)，适合实现队列或滑动窗口。"}, {"qid": "d004q5", "type": "code", "stem": "写函数 `first_duplicate(nums)`：从左到右扫描一个整数列表，返回第一个重复出现的元素，没有重复则返回 None。要求用 set 记录已见元素，整体 O(n)，不要用嵌套循环。4–8 行。", "answer": "def first_duplicate(nums):\n    seen = set()\n    for n in nums:\n        if n in seen:\n            return n\n        seen.add(n)\n    return None", "explain": "判分要点：用 set 做 O(1) 成员判断，只遍历一次；命中即返回而不是先统计次数；没有重复时返回 None。"}], "5": [{"qid": "d005q1", "type": "single", "stem": "关于可迭代对象与迭代器，下列说法正确的是？", "options": ["A  实现了 `__iter__` 的对象一定是迭代器", "B  迭代器实现了 `__next__`，耗尽后再取会抛 StopIteration，且不能重用", "C  list 本身就是迭代器，所以可以直接 next(lst)", "D  生成器只能遍历一次，是因为它没有实现 `__iter__`"], "answer": "B", "explain": "迭代器要同时有 `__iter__` 与 `__next__`（A 错）；list 是可迭代对象而非迭代器，next(lst) 报 TypeError（C 错）；生成器实现了 `__iter__`，不能重复遍历是游标被消费完（D 错）。"}, {"qid": "d005q2", "type": "single", "stem": "执行以下代码，三行输出依次是什么？\n\n```python\ndef gen():\n    print(\"start\")\n    yield 1\n\ng = gen()\nprint(\"created\")\nprint(next(g))\n```", "options": ["A  start / created / 1", "B  created / start / 1", "C  created / 1", "D  start / 1 / created"], "answer": "B", "explain": "调用生成器函数只创建生成器对象，函数体不执行，所以先打印 created；第一次 next 才开始执行到 yield，打印 start 并产出 1。"}, {"qid": "d005q3", "type": "judge", "stem": "表达式 `(x * 2 for x in range(3))` 会立即计算并生成一个包含三个元素的序列。", "answer": false, "explain": "生成器表达式是惰性的，只创建生成器对象，元素在每次 next 时才逐个计算；要立即得到序列应使用列表推导 `[x * 2 for x in range(3)]`。"}, {"qid": "d005q4", "type": "fill", "stem": "迭代器把元素产出完之后，再调用其 `__next__` 会抛出 ____ 异常（填异常类名），for 循环正是靠它结束循环。", "answer": ["StopIteration"], "explain": "for 循环内部反复调用 next()，捕获 StopIteration 后正常结束。这个异常不应手动抛出，也不该被业务代码吞掉。"}, {"qid": "d005q5", "type": "code", "stem": "写生成器函数 `chunks(iterable, size)`：把可迭代对象切成长度为 size 的列表依次产出，最后一块可以不足 size。要求惰性处理，不得先把全部数据读进内存。5–10 行。", "answer": "def chunks(iterable, size):\n    batch = []\n    for item in iterable:\n        batch.append(item)\n        if len(batch) == size:\n            yield batch\n            batch = []\n    if batch:\n        yield batch", "explain": "判分要点：用 yield 逐块产出而不是返回列表；攒满一块就重置；循环结束后把最后不足 size 的一块也产出。不能写成 list(iterable) 后再切片。"}], "6": [{"qid": "d006q1", "type": "single", "stem": "执行以下代码后输出是什么？\n\n```python\ndef f(items=[]):\n    items.append(1)\n    return items\n\na = f()\nb = f()\nprint(a is b, len(a))\n```", "options": ["A  False 1", "B  True 1", "C  True 2", "D  False 2"], "answer": "C", "explain": "可变默认值只创建一次，两次调用返回同一个 list 对象，所以身份相同（True），且里面累积了两个 1。"}, {"qid": "d006q2", "type": "single", "stem": "要找出两个各含 10 万条字符串的列表中共同出现的元素，下列写法最快的是？", "options": ["A  `[x for x in a if x in b]`，其中 b 是 list", "B  `set(a) & set(b)`", "C  两层 for 循环逐个比较", "D  先对 b 调用 sorted 再用 `in` 判断"], "answer": "B", "explain": "把两侧转成 set 后求交集，整体近似 O(n+m)；A、C 都是 O(n×m)；排序 b 得到 O(n log n + m log n)，也不如集合交集快。"}, {"qid": "d006q3", "type": "judge", "stem": "一个类定义了 `__eq__` 但没有定义 `__hash__`，它的实例仍能放进 set 中。", "answer": false, "explain": "此时 `__hash__` 被置为 None，实例不可哈希，放进 set 会抛 TypeError。要放进 set 必须同时实现 `__hash__`，并保证相等对象哈希相同。"}, {"qid": "d006q4", "type": "fill", "stem": "只实现了 `__iter__`、没有实现 `__next__` 的对象，被称为 ____（填术语，可写中文术语或英文单词）。", "answer": ["可迭代对象", "iterable", "可迭代"], "explain": "可迭代对象（iterable）通过 `__iter__` 返回迭代器；迭代器（iterator）才额外实现 `__next__`，两者不是同一回事。"}, {"qid": "d006q5", "type": "code", "stem": "写函数 `dedupe(items)`：对列表去重并保持元素首次出现的顺序，要求整体 O(n)，不要用嵌套循环。5–9 行。", "answer": "def dedupe(items):\n    seen = set()\n    result = []\n    for item in items:\n        if item not in seen:\n            seen.add(item)\n            result.append(item)\n    return result", "explain": "判分要点：set 负责判断是否见过（O(1)），list 负责保序（set 本身会丢顺序）；另一可行写法是 `list(dict.fromkeys(items))`。"}], "7": [{"qid": "d007q1", "type": "single", "stem": "执行以下代码，输出是什么？\n\n```python\nfs = [lambda: i for i in range(3)]\nprint([f() for f in fs])\n```", "options": ["A  [0, 1, 2]", "B  [2, 2, 2]", "C  [3, 3, 3]", "D  抛出 UnboundLocalError"], "answer": "B", "explain": "闭包捕获的是变量 i 本身。推导结束后 i 的值是 2，三个 lambda 读的是同一个 i，所以都是 2。要固化当次的值需用默认参数 `lambda i=i: i`。"}, {"qid": "d007q2", "type": "single", "stem": "以下代码在调用 f() 时报什么错？\n\n```python\nx = 1\ndef f():\n    print(x)\n    x = 2\nf()\n```", "options": ["A  NameError：x 未定义", "B  没有错误，输出 1", "C  UnboundLocalError：x 被当成局部变量，打印时还没赋值", "D  SyntaxError：局部变量与全局变量重名"], "answer": "C", "explain": "函数内出现了对 x 的赋值，x 就整个函数体都属于局部作用域，`print(x)` 执行时局部 x 尚未绑定，因此报 UnboundLocalError；要读全局值需声明 global。"}, {"qid": "d007q3", "type": "judge", "stem": "闭包捕获的是外层变量在闭包创建时刻的值，所以在循环中创建的多个函数会各自保存当时那个值。", "answer": false, "explain": "闭包保存的是变量（cell）而不是快照值，只有函数被调用时才去读。循环里要用默认参数或工厂函数把值固定下来，才可能各自不同。"}, {"qid": "d007q4", "type": "fill", "stem": "在嵌套函数中要给外层函数的局部变量重新赋值，必须用关键字 ____ 声明（只填关键字）。", "answer": ["nonlocal"], "explain": "nonlocal 把名字绑定到最近的外层函数作用域；只是读取外层变量不需要声明，一旦在函数内赋值而不声明就会 UnboundLocalError。"}, {"qid": "d007q5", "type": "code", "stem": "写一个工厂函数 `make_counter(start=0)`：返回一个函数对象，每次调用返回比上一次大 1 的整数，第一次调用返回 start + 1。状态必须保存在闭包里，不能用全局变量或类属性。", "answer": "def make_counter(start=0):\n    n = start\n\n    def step():\n        nonlocal n\n        n += 1\n        return n\n\n    return step", "explain": "判分要点：必须用 nonlocal 把 n 的赋值写回外层绑定（或把状态放进可变容器），否则 step 内 n += 1 会 UnboundLocalError；start 作为参数而不是写死的 0 才算完整。"}], "8": [{"qid": "d008q1", "type": "single", "stem": "`@dec` 写在 def 上方，等价于下面哪一句？", "options": ["A  f = dec()(f)", "B  dec(f)", "C  f = dec(f)", "D  f = f(dec)"], "answer": "C", "explain": "解释器把被装饰函数对象作为唯一实参传给 dec，并用返回值替换该名字。`dec()(f)` 对应的是 `@dec()` 这种带参数形式。"}, {"qid": "d008q2", "type": "single", "stem": "加了装饰器后 `f.__name__` 变成 `\"wrapper\"`，最合适的修法是？", "options": ["A  把内层函数直接改名为 f", "B  给 wrapper 加 @staticmethod", "C  在 wrapper 里 print 出原函数名", "D  在 wrapper 上加 @functools.wraps(func)"], "answer": "D", "explain": "functools.wraps 会一并复制 __name__、__doc__、__module__、__qualname__ 并设置 __wrapped__，比手工改单个属性完整；改名或打印都不改变内省看到的信息。"}, {"qid": "d008q3", "type": "judge", "stem": "使用 @dec 装饰函数时，dec 本身在函数定义（模块导入）阶段就会被调用执行，被装饰函数体内的代码则要等到真正调用时才执行。", "answer": true, "explain": "装饰是在 def 语句执行完毕、函数对象创建之后立即发生的；wrapper 里的 func(...) 才对应运行时调用，二者时机不同。"}, {"qid": "d008q4", "type": "fill", "stem": "要让 wrapper 保留被装饰函数的 __name__、__doc__ 等元信息，应在 wrapper 上加 `@functools.____(func)` 装饰器（填名字）。", "answer": ["wraps"], "explain": "functools.wraps 是 functools.update_wrapper 的便捷形式，把原函数元信息复制到包装函数上，是可复用装饰器的标准写法。"}, {"qid": "d008q5", "type": "code", "stem": "写一个 `count_calls` 装饰器：被装饰函数照常返回自己的结果，同时在函数对象上维护属性 `calls`，记录它被调用过多少次。要求保留元信息，并保证多次调用累加。", "answer": "import functools\n\ndef count_calls(func):\n    @functools.wraps(func)\n    def wrapper(*args, **kwargs):\n        wrapper.calls += 1\n        return func(*args, **kwargs)\n\n    wrapper.calls = 0\n    return wrapper", "explain": "判分要点：用 *args/**kwargs 转发并 return func(...)；计数状态挂在 wrapper 上（wrapper.calls）才能在调用间累加；加 @functools.wraps 保证 __name__ 等元信息不丢。"}], "9": [{"qid": "d009q1", "type": "single", "stem": "关于带参数装饰器的三层结构，说法正确的是？", "options": ["A  最外层直接接收被装饰函数对象", "B  最外层接收装饰器参数并返回一个装饰器函数", "C  中间层负责在每次调用时执行被装饰函数", "D  两层就够，参数改成全局变量即可"], "answer": "B", "explain": "最外层收参数返回 decorator，中间层收 func 返回 wrapper，最内层 wrapper 才在调用时执行原函数；`@retry(times=3)` 即 `func = retry(times=3)(func)`。"}, {"qid": "d009q2", "type": "single", "stem": "下面的重试装饰器最需要修的问题是哪个？\n\n```python\ndef retry(func):\n    def wrapper(*a, **kw):\n        for _ in range(3):\n            try:\n                return func(*a, **kw)\n            except Exception:\n                continue\n    return wrapper\n```", "options": ["A  必须用 while True 才能实现重试", "B  装饰器返回前必须先调用一次 func", "C  缺少 @functools.wraps，导致异常不会被抛出", "D  吞掉所有异常，三次都失败时静默返回 None，调用方无法感知失败"], "answer": "D", "explain": "只捕获不重抛，循环结束后 wrapper 隐式返回 None，失败被伪装成成功；同时 except Exception 把不该重试的错误也重试了。wraps 只影响元信息，与异常是否抛出无关。"}, {"qid": "d009q3", "type": "judge", "stem": "重试装饰器中的 `except Exception` 会把 KeyboardInterrupt 和 SystemExit 也捕获下来。", "answer": false, "explain": "两者继承自 BaseException 而不是 Exception，不会被 except Exception 捕获。要捕获它们必须显式列出，通常也不该在重试逻辑里处理。"}, {"qid": "d009q4", "type": "fill", "stem": "每次失败后等待时间按固定倍数递增、并设定上限的重试策略，中文术语叫 ____（填中文术语或英文名均可）。", "answer": ["指数退避", "exponential backoff", "指数退避策略"], "explain": "指数退避（exponential backoff）让等待时间随失败次数成倍增长，避免持续冲击已经过载的下游，通常还会加抖动与最大等待上限。"}, {"qid": "d009q5", "type": "code", "stem": "实现带参数的装饰器 `retry(times=3, delay=0.01, backoff=2.0, exceptions=(ValueError,))`：只重试 exceptions 里指定的异常；每次失败后等待时间乘 backoff；最后一次仍失败时原样抛出异常。可用 time.sleep，注意保留元信息。", "answer": "import functools\nimport time\n\ndef retry(times=3, delay=0.01, backoff=2.0, exceptions=(ValueError,)):\n    def decorator(func):\n        @functools.wraps(func)\n        def wrapper(*args, **kwargs):\n            wait = delay\n            for attempt in range(1, times + 1):\n                try:\n                    return func(*args, **kwargs)\n                except exceptions:\n                    if attempt == times:\n                        raise\n                    time.sleep(wait)\n                    wait *= backoff\n        return wrapper\n    return decorator", "explain": "判分要点：三层结构缺一不可；只捕获 exceptions 指定类型；attempt == times 时必须 raise 而不是继续循环或 return None；等待时间按 backoff 递增；用 functools.wraps 保住元信息。"}], "10": [{"qid": "d010q1", "type": "single", "stem": "with 块内抛出异常，而该上下文管理器的 __exit__ 返回了 True，结果是？", "options": ["A  异常被抑制，with 之后的语句继续执行", "B  异常被重新抛出，但会多打一条日志", "C  只有 ValueError 才会被抑制", "D  异常被抑制，且 finally 块不再执行"], "answer": "A", "explain": "真值表示\"异常已处理\"，with 语句正常结束，后续代码照常运行。抑制与异常类型无关，也和 finally 是否执行无关。"}, {"qid": "d010q2", "type": "single", "stem": "使用 @contextmanager 时，为什么要把 yield 放进 try/finally 里？", "options": ["A  只有放在 finally 里 yield 才能拿到返回值", "B  不加 try 生成器无法被垃圾回收", "C  块内异常会从 yield 处抛回生成器，不接住就执行不到收尾代码", "D  finally 块中不允许出现 yield"], "answer": "C", "explain": "contextmanager 用生成器实现 __enter__/__exit__，异常通过 throw 送回 yield 处，只有 try/finally（或 try/except）才能保证清理逻辑一定执行。"}, {"qid": "d010q3", "type": "judge", "stem": "with 语句块内抛出异常时，__exit__ 方法不会被调用。", "answer": false, "explain": "无论正常退出还是异常退出，__exit__ 都会被调用，这正是它承担收尾职责的原因；不同之处只在于它收到的是异常三元组还是 (None, None, None)。"}, {"qid": "d010q4", "type": "fill", "stem": "若希望 __exit__ 抑制 with 块内的异常，它必须返回 ____（填布尔值）。", "answer": ["True", "true"], "explain": "返回真值时 with 视为异常已处理并继续向下执行；返回 False 或 None 则异常照常向外传播。"}, {"qid": "d010q5", "type": "code", "stem": "写一个上下文管理器类 `Timer`：进入 with 时记录起始时间并把实例本身交给 as，退出时把耗时（秒，浮点）写入实例属性 `elapsed`，且不抑制块内异常。", "answer": "import time\n\nclass Timer:\n    def __enter__(self):\n        self.start = time.perf_counter()\n        return self\n\n    def __exit__(self, exc_type, exc, tb):\n        self.elapsed = time.perf_counter() - self.start\n        return False", "explain": "判分要点：__enter__ 必须 return self，否则 `with Timer() as t` 拿到的是 None；__exit__ 要接收三个参数并返回 False/None，让异常继续传播；用 time.perf_counter() 计时比 time.time() 更稳。"}], "11": [{"qid": "d011q1", "type": "single", "stem": "关于 `raise NewError(\"上游失败\") from exc`，说法正确的是？", "options": ["A  丢弃 exc，只保留 NewError 的信息", "B  把 exc 记为 NewError 的 __cause__，traceback 保留原始异常", "C  会同时抛出两个异常，需要调用方捕获两次", "D  只影响日志格式，不影响 traceback 内容"], "answer": "B", "explain": "from 把原异常挂到新异常的 __cause__，报错信息里会显示直接原因链；省略 from 时解释器仍会设置 __context__，但显式 from 更清晰。"}, {"qid": "d011q2", "type": "single", "stem": "在异常处理代码里，最应该避免的是哪一种写法？", "options": ["A  except (TimeoutError, ConnectionError): retry()", "B  except ValueError as e: logger.warning(\"bad input %s\", e); raise", "C  finally: conn.close()", "D  except Exception: pass"], "answer": "D", "explain": "裸捕获全部异常且不做任何处理，会把失败伪装成正常流程，丢失堆栈与因果链；B 记录后用裸 raise 重新抛出、保留原 traceback，是推荐写法。"}, {"qid": "d011q3", "type": "judge", "stem": "`except Exception` 能够捕获 KeyboardInterrupt 与 SystemExit。", "answer": false, "explain": "二者派生自 BaseException 而非 Exception，所以不会被 except Exception 拦下；这也说明自定义业务异常应当继承 Exception，避免参与这类进程级信号的语义。"}, {"qid": "d011q4", "type": "fill", "stem": "抛出新的业务异常时，用它把原始异常登记为 __cause__ 的关键字是 ____（填关键字）。", "answer": ["from"], "explain": "`raise NewError(...) from exc` 保留因果链；写成 `from None` 则显式切断因果链，只在不想暴露内部实现细节时使用。"}, {"qid": "d011q5", "type": "code", "stem": "定义异常层次 `AppError(Exception)` 及其子类 `ValidationError`、`NotFoundError`（都直接继承 AppError），再写函数 `get_user(users, uid)`：uid 不是字符串时抛 ValidationError，uid 不在 users 中时抛 NotFoundError，否则返回 users[uid]。", "answer": "class AppError(Exception):\n    pass\n\nclass ValidationError(AppError):\n    pass\n\nclass NotFoundError(AppError):\n    pass\n\ndef get_user(users, uid):\n    if not isinstance(uid, str):\n        raise ValidationError(f\"uid 必须是字符串: {uid!r}\")\n    if uid not in users:\n        raise NotFoundError(f\"用户不存在: {uid}\")\n    return users[uid]", "explain": "判分要点：两个业务异常都要继承 AppError，调用方才能用 except AppError 统一处理；不要继承 BaseException；异常消息要带上出错的值，便于定位。"}], "12": [{"qid": "d012q1", "type": "single", "stem": "下面这个装饰器的缺陷是什么？\n\n```python\ndef logged(func):\n    def wrapper(*args, **kwargs):\n        print(\"calling\", func.__name__)\n        func(*args, **kwargs)\n    return wrapper\n```", "options": ["A  缺少 functools.wraps，导致 func 无法被调用", "B  wrapper 没有 return，被装饰函数有返回值时调用方拿到 None", "C  *args/**kwargs 不能用于装饰器，会丢失参数", "D  print 会改变被装饰函数的签名"], "answer": "B", "explain": "wrapper 只调用了 func 却没返回它的结果，被装饰函数相当于被改成永远返回 None，属于典型的\"包装层改变语义\"；wraps 只影响元信息，与调用是否成功无关。"}, {"qid": "d012q2", "type": "single", "stem": "某服务把业务异常基类定义成 `class BizError(BaseException)`，最可能引发什么问题？", "options": ["A  代码里常见的 `except Exception` 不再捕获它，异常会穿过所有兜底逻辑", "B  继承 BaseException 会让它无法携带异常消息", "C  继承 BaseException 后该类不能被 raise 抛出", "D  子类无法再被继承"], "answer": "A", "explain": "BaseException 的子树不属于 Exception，`except Exception`、常用的框架兜底与日志中间件都拦不住它，错误会一路冒到顶层。业务异常应继承 Exception。"}, {"qid": "d012q3", "type": "judge", "stem": "装饰器只应改变控制流的时序，不应吞掉异常或改变被装饰函数的返回值；因此 wrapper 忘记 return 属于实现缺陷。", "answer": true, "explain": "重试、计时、缓存这类包装不改变成功/失败的结论。wrapper 不转发返回值会让调用方拿到 None，把失败或正常结果都掩盖掉，与静默吞异常同类。"}, {"qid": "d012q4", "type": "fill", "stem": "重试装饰器在最后一次尝试失败时，应写成 `if attempt == times: ____`（填关键字），以免调用方把失败当成功。", "answer": ["raise"], "explain": "在 except 块里裸 raise 会重新抛出当前异常并保留 traceback；若省略这一句，循环结束后 wrapper 会隐式返回 None，失败被伪装成正常返回。"}, {"qid": "d012q5", "type": "code", "stem": "用 `contextlib.contextmanager` 写一个 `suppress(exception_type)` 上下文管理器，行为与标准库 `contextlib.suppress` 一致：块内抛出 exception_type 指定的异常时被抑制，其它异常继续向外传播。", "answer": "from contextlib import contextmanager\n\n@contextmanager\ndef suppress(exception_type):\n    try:\n        yield\n    except exception_type:\n        pass", "explain": "判分要点：必须用 @contextmanager 装饰生成器；yield 包在 try 内、except 只接 exception_type（可以是类型或元组）；不要写成 except Exception，否则会把不该吞的错误也吞掉。"}], "13": [{"qid": "d013q1", "type": "single", "stem": "关于函数类型标注在运行时的作用，下面哪个说法正确？", "options": ["A  传入与标注不符的参数会立刻抛出 TypeError", "B  标注是元数据，保存在 __annotations__ 中，不参与运行时检查", "C  标注会被编译成 C 层类型断言，只在调试模式下生效", "D  只有被 @dataclass 装饰的类，方法标注才会被解释器读取"], "answer": "B", "explain": "解释器不读函数标注做校验，所以 add(\"1\", \"2\") 会静默返回字符串 \"12\"。标注供编辑器、静态检查器与框架读取，属于元数据。"}, {"qid": "d013q2", "type": "single", "stem": "在一个已有几十个模块、完全没有标注的项目里引入类型检查，最可行的做法是？", "options": ["A  一次性给所有文件打开严格模式，逼团队一轮清空报错", "B  先检查新代码与本次改动的文件，再逐步扩大范围、逐条打开规则", "C  只在代码评审时人工确认标注是否写全，不引入工具", "D  用静态检查器生成 .pyc，跳过运行时的类型开销"], "answer": "B", "explain": "渐进收紧能立刻拦住新增问题，又不会因为历史文件报错太多而导致检查被放弃。全面严格模式通常只会换来一次集体忽略。"}, {"qid": "d013q3", "type": "judge", "stem": "把参数标注为 str 却传入 int，只要代码里没有显式调用类型检查逻辑，函数通常仍能正常执行。", "answer": true, "explain": "标注不改变运行时行为。函数是否出错只取决于函数体里实际做的运算，比如字符串与整数相加才会抛异常。"}, {"qid": "d013q4", "type": "fill", "stem": "函数注解在运行时保存在函数的 ____ 属性里（填完整属性名）。", "answer": ["__annotations__"], "explain": "函数注解以字典形式存在 __annotations__ 中，键是参数名、值是标注对象，返回值用 'return' 作键。"}, {"qid": "d013q5", "type": "code", "stem": "写一个函数 parse_int_list(raw: str) -> list[int]：把形如 \"1, 2, 3\" 的字符串解析成整数列表，空串或纯空白返回空列表。要求写全类型标注，只用标准库，4–6 行即可。", "answer": "def parse_int_list(raw: str) -> list[int]:\n    if not raw.strip():\n        return []\n    return [int(part) for part in raw.split(\",\")]", "explain": "判分要点：参数与返回都有标注且用内置泛型写法；空串返回 [] 而不是报错；int() 能自动忽略数字前后的空格。"}], "14": [{"qid": "d014q1", "type": "single", "stem": "标注 Optional[int] 的含义是？", "options": ["A  参数可以不传，等于自带一个默认值", "B  值可能是 int 也可能是 None，等价于 int | None", "C  值必须是 int 的子类", "D  值为 None 时会被自动替换成 0"], "answer": "B", "explain": "Optional 只表达「可以是 None」，与 int | None 等价。参数能不能省略由默认值决定，与 Optional 无关。"}, {"qid": "d014q2", "type": "single", "stem": "用 TypedDict 定义好 Order 后，把一个缺少 amount 键的普通 dict 传进函数，会发生什么？", "options": ["A  运行时立刻抛出 TypeError", "B  运行时抛出校验错误，并指出缺哪个字段", "C  运行时不报错，只有静态检查器会提示缺字段", "D  字典会被自动补上 amount=0.0"], "answer": "C", "explain": "TypedDict 在运行时就是 dict，没有任何校验逻辑；缺字段的提示完全来自静态检查器。要运行时拦截必须用校验库或手写检查。"}, {"qid": "d014q3", "type": "judge", "stem": "标注为 Literal[\"a\", \"b\"] 的参数，在运行时传入 \"c\" 会被自动拦截。", "answer": false, "explain": "Literal 是纯静态约束，解释器不会检查。运行时是否报错只取决于函数体做了什么，非法取值需要显式校验。"}, {"qid": "d014q4", "type": "fill", "stem": "把「str 或 None」写成 typing 里的旧式标注是 ____（填标注表达式，形如 X[Y]），也可以写成 str | None。", "answer": ["Optional[str]", "str | None"], "explain": "Optional[str] 与 str | None 完全等价，前者需要从 typing 导入，后者是运算符写法，Python 3.10 起可用。"}, {"qid": "d014q5", "type": "code", "stem": "先用 TypedDict 定义 Order，字段为 order_no: str、amount: float、status: Literal[\"paid\", \"unpaid\"]；再写函数 sum_by_status(orders: list[Order], status: Literal[\"paid\", \"unpaid\"]) -> float，返回匹配状态的金额合计。只用标准库。", "answer": "from typing import Literal, TypedDict\n\nclass Order(TypedDict):\n    order_no: str\n    amount: float\n    status: Literal[\"paid\", \"unpaid\"]\n\ndef sum_by_status(orders: list[Order], status: Literal[\"paid\", \"unpaid\"]) -> float:\n    return sum(o[\"amount\"] for o in orders if o[\"status\"] == status)", "explain": "判分要点：TypedDict 字段名与类型齐全；两个 Literal 取值一致；用 sum + 生成器表达式，不修改入参也不新建对象。"}], "15": [{"qid": "d015q1", "type": "single", "stem": "在 def first_or_default(items: list[T], default: T) -> T 中，T 的作用是？", "options": ["A  把参数和返回值都放宽成 Any，避免报类型错", "B  表达元素与返回值是同一类型，调用时由实参推断出 T", "C  声明一个可以在运行时实例化的泛型容器", "D  只在类定义中有效，函数里会被忽略"], "answer": "B", "explain": "类型变量把多个位置绑在一起：传 list[int] 时返回值也被推成 int。写成 Any 就丢掉了这层关系。"}, {"qid": "d015q2", "type": "single", "stem": "类 Circle 没有继承 HasArea，只实现了 area() 方法。把它传给参数标注为 list[HasArea] 的函数会怎样？", "options": ["A  运行时 isinstance 检查失败，抛 TypeError", "B  静态检查器接受，因为它满足协议要求的形状", "C  必须先调用 HasArea.register(Circle) 才能通过", "D  函数内部调用 s.area() 会被解释器改写成动态查找，语义不同"], "answer": "B", "explain": "Protocol 是结构化子类型：只要具备约定的方法或属性就满足协议，无需显式继承，也不需要注册。"}, {"qid": "d015q3", "type": "judge", "stem": "用 @runtime_checkable 装饰的协议，在 isinstance() 时会逐项校验方法签名是否匹配。", "answer": false, "explain": "运行时检查只看成员名是否存在，不比较参数与返回类型；签名一致性由静态检查器负责。"}, {"qid": "d015q4", "type": "fill", "stem": "在 typing 中声明一个可复用的类型变量 T，写法是 T = ____(\"T\")。", "answer": ["TypeVar"], "explain": "TypeVar(\"T\") 创建类型变量，字符串参数是它的名字，用于报错信息和调试，必须与变量名一致以便阅读。"}, {"qid": "d015q5", "type": "code", "stem": "写一个泛型函数 group_by(items: list[T], key: Callable[[T], str]) -> dict[str, list[T]]：按 key 的返回值把元素分组，保持每组内元素原有顺序。用 TypeVar 标注，只用标准库。", "answer": "from collections import defaultdict\nfrom typing import Callable, TypeVar\n\nT = TypeVar(\"T\")\n\ndef group_by(items: list[T], key: Callable[[T], str]) -> dict[str, list[T]]:\n    groups: dict[str, list[T]] = defaultdict(list)\n    for item in items:\n        groups[key(item)].append(item)\n    return dict(groups)", "explain": "判分要点：T 同时用在元素和分组值上，体现类型关联；defaultdict 或 setdefault 保证顺序与首次创建；返回新 dict，不改入参。"}], "16": [{"qid": "d016q1", "type": "single", "stem": "关于静态类型检查与 pydantic 运行时校验的分工，哪个说法正确？", "options": ["A  有了静态检查，外部输入就不需要运行时校验了", "B  静态检查保证代码内部类型一致，外部输入必须在边界做运行时校验", "C  pydantic 模型会在 CI 阶段检查所有类型不一致", "D  两者功能重复，选一个用即可"], "answer": "B", "explain": "静态检查看不到运行期流入的数据，无法判断 JSON 里到底有没有某个字段；边界校验和内部类型一致性是两件事。"}, {"qid": "d016q2", "type": "single", "stem": "pydantic v2 中构造模型时数据不满足字段约束，会发生什么？", "options": ["A  返回 None，同时在日志里记一条警告", "B  抛出 pydantic.ValidationError，可用 .errors() 取结构化错误", "C  把不合规字段静默替换成默认值", "D  抛出不含字段位置的 TypeError"], "answer": "B", "explain": "校验失败抛 ValidationError（ValueError 的子类），errors() 给出 loc/msg/type 列表，json() 可直接返回给调用方。"}, {"qid": "d016q3", "type": "judge", "stem": "pydantic v2 里 Field(gt=0) 修饰的字段，填入 0 也能通过校验。", "answer": false, "explain": "gt 表示严格大于，0 不满足 gt=0，会触发校验错误；若要允许 0 应写 ge=0。"}, {"qid": "d016q4", "type": "fill", "stem": "pydantic v2 中把字典转成模型实例的类方法是 ____（填方法名）。", "answer": ["model_validate"], "explain": "model_validate(obj) 在 v2 中取代了 v1 的 parse_obj；配套的序列化方法是 model_dump 与 model_dump_json。"}, {"qid": "d016q5", "type": "code", "stem": "不用第三方库，写边界校验函数 parse_order(payload: dict) -> dict：要求 order_no 是非空字符串、amount 是能转成正数的数字（数字或数字字符串都接受）。返回规整后的 {\"order_no\": str, \"amount\": float}；缺字段或不合规时抛 ValueError，消息里包含字段名。", "answer": "def parse_order(payload: dict) -> dict:\n    order_no = payload.get(\"order_no\")\n    if not isinstance(order_no, str) or not order_no.strip():\n        raise ValueError(\"order_no 必须是非空字符串\")\n    try:\n        amount = float(payload[\"amount\"])\n    except (KeyError, TypeError, ValueError):\n        raise ValueError(\"amount 必须是数字\") from None\n    if amount <= 0:\n        raise ValueError(\"amount 必须大于 0\")\n    return {\"order_no\": order_no, \"amount\": amount}", "explain": "判分要点：错误消息里点名到字段；amount 同时接受数字与数字字符串；必须大于 0；返回规整后的新字典而不是原对象。"}], "17": [{"qid": "d017q1", "type": "single", "stem": "下面哪一项 ruff 本身不会检查？", "options": ["A  未使用的导入", "B  与 None 使用 == 比较", "C  变量标注与实际赋值的类型不一致", "D  导入语句是否排序"], "answer": "C", "explain": "类型一致性属于类型检查器的职责，ruff 是 linter 与格式化工具，不做跨语句的类型推断。"}, {"qid": "d017q2", "type": "single", "stem": "CI 里要求「代码已格式化，但不改动仓库文件」，应使用哪条命令？", "options": ["A  ruff format .", "B  ruff format --check .", "C  ruff check --fix .", "D  ruff format --write ."], "answer": "B", "explain": "--check 只判断并返回退出码，不写文件。直接 ruff format . 会就地改写文件，CI 里还会额外跑 --fix，都不合适。"}, {"qid": "d017q3", "type": "judge", "stem": "把 ruff check --fix 放在 CI 里自动修改代码并提交回分支，是推荐的门禁做法。", "answer": false, "explain": "门禁只做断言，避免掩盖问题并与人的改动产生冲突；自动修复应放在本地 pre-commit 或保存钩子里。"}, {"qid": "d017q4", "type": "fill", "stem": "运行 ruff 的 lint 规则检查应使用子命令 ruff ____ .（填子命令名）。", "answer": ["check"], "explain": "ruff check 负责 lint 规则，ruff format 负责格式化；两者是独立的子命令，可以分别接进流水线。"}, {"qid": "d017q5", "type": "code", "stem": "ruff check --output-format=json 的输出是列表，每项形如 {\"code\": \"F401\", \"message\": \"...\"}。写函数 count_codes(diagnostics: list[dict]) -> list[tuple[str, int]]，统计每个规则码出现次数，按次数降序、次数相同按规则码字典序升序返回。只用标准库。", "answer": "def count_codes(diagnostics: list[dict]) -> list[tuple[str, int]]:\n    counts: dict[str, int] = {}\n    for item in diagnostics:\n        code = item.get(\"code\") or \"UNKNOWN\"\n        counts[code] = counts.get(code, 0) + 1\n    return sorted(counts.items(), key=lambda kv: (-kv[1], kv[0]))", "explain": "判分要点：缺失 code 时有兜底；排序键写成 (-次数, 规则码) 才能同时满足降序与字典序升序；返回的是 list[tuple] 而非 dict。"}], "18": [{"qid": "d018q1", "type": "single", "stem": "函数 def load(raw: str) -> list[int] 的实现是：raw 为空串时返回 []，否则返回 [int(x) for x in raw.split(\",\")]。下面哪个判断正确？", "options": ["A  返回标注应改成 list[int] | None，因为可能返回空列表", "B  标注正确：所有路径都返回 list[int]，空输入返回的是空列表而不是 None", "C  参数标注应写成 Optional[str]，否则空串无法传入", "D  必须写成 Union[list[int], None]，Python 不允许用 list[int] 作返回标注"], "answer": "B", "explain": "空列表仍是 list[int]，与 None 无关；Optional 只影响「能不能是 None」。参数标注 str 已能接受空串。"}, {"qid": "d018q2", "type": "single", "stem": "模型字段为 order_no: str = Field(min_length=6) 与 amount: float = Field(gt=0)，输入 {\"order_no\": \"A1001\", \"amount\": \"0\"} 会怎样？", "options": ["A  两个字段都通过，只产生一条警告", "B  两个字段都会校验失败：order_no 长度不足，amount 不满足大于 0", "C  只有 amount 失败，字符串形式的数字不会被转换", "D  只有 order_no 失败，字符串数字无法转成 float"], "answer": "B", "explain": "\"A1001\" 长度为 5，小于 min_length=6；\"0\" 在宽松模式下会转成 0.0，不满足 gt=0。两个字段都会进入错误列表。"}, {"qid": "d018q3", "type": "judge", "stem": "把只实现了 area() 方法、没有显式继承某 Protocol 的类实例，传给标注为 list[HasArea] 的参数，静态检查器会拒绝。", "answer": false, "explain": "Protocol 采取结构化子类型判断，只要求具备约定的成员，不需要显式继承或注册，因此会被接受。"}, {"qid": "d018q4", "type": "fill", "stem": "除了 Optional[str]，表示「字符串或 None」还可以写成 ____（使用 | 运算符）。", "answer": ["str | None"], "explain": "X | Y 是联合类型运算符写法，str | None 与 Optional[str] 语义相同，也是当前更推荐的写法。"}, {"qid": "d018q5", "type": "code", "stem": "写函数 summarize_orders(payloads: list[dict]) -> dict[str, float]：每项形如 {\"order_no\": str, \"amount\": 数字或数字字符串, \"status\": \"paid\"|\"unpaid\"}。order_no 为空、amount 无法转成正数、status 不在允许集合内的记录直接跳过；返回 {\"paid\": 合计, \"unpaid\": 合计}，没有记录的状态合计为 0.0。带完整标注，只用标准库。", "answer": "def summarize_orders(payloads: list[dict]) -> dict[str, float]:\n    totals: dict[str, float] = {\"paid\": 0.0, \"unpaid\": 0.0}\n    for item in payloads:\n        order_no = item.get(\"order_no\")\n        status = item.get(\"status\")\n        if not isinstance(order_no, str) or not order_no.strip():\n            continue\n        if status not in totals:          # 字典的键同时充当允许集合\n            continue\n        try:\n            amount = float(item.get(\"amount\"))\n        except (TypeError, ValueError):\n            continue\n        if amount != amount or amount <= 0:   # 排除 NaN 与非正数\n            continue\n        totals[status] += amount\n    return totals", "explain": "判分要点：三类非法记录都跳过而不是抛异常；totals 预置两个键，保证缺项时是 0.0；用 status not in totals 当允许集合；NaN 需显式排除，否则会污染合计。"}], "19": [{"qid": "d019q1", "type": "single", "stem": "在一个分层的服务里，下面哪一种 import 破坏了依赖方向？", "options": ["A  业务层 import 数据层的仓储类", "B  数据层 import 业务层的服务类", "C  接口层 import 业务层的服务类", "D  业务层 import 标准库的 json"], "answer": "B", "explain": "依赖方向只允许上层指向下层。数据层反过来 import 业务层，会让存储代码依赖业务规则，业务层也无法脱离数据库单独测试。"}, {"qid": "d019q2", "type": "single", "stem": "接口层的路由函数里，最恰当的职责是哪一项？", "options": ["A  判断订单状态是否允许改派", "B  解析入参并调用业务层，再把返回结果序列化", "C  直接拼 SQL 查询订单表", "D  计算折扣金额并写回数据库"], "answer": "B", "explain": "接口层负责协议相关的转换：入参解析、调用、结果序列化。状态判断属于业务规则，SQL 与写库属于数据层，放错层会让规则无法复用也难以测试。"}, {"qid": "d019q3", "type": "judge", "stem": "业务层直接 import 某个具体的数据库客户端模块，会让业务逻辑的单元测试更难写，因为测试必须准备真实数据库。", "answer": true, "explain": "直接依赖具体实现后，业务层无法脱离该客户端运行。改成接收满足协议的仓储对象，测试即可注入内存假实现。"}, {"qid": "d019q4", "type": "fill", "stem": "为了让测试导入的是安装进环境的包，而不是仓库根目录下同名的文件夹，通常把包放在 ____/ 目录下（填目录名）。", "answer": ["src", "src/"], "explain": "这是 src 布局：包目录与项目根分离，只有安装后才会出现在解释器的搜索路径上，从而提前暴露打包遗漏。"}, {"qid": "d019q5", "type": "code", "stem": "给定模块依赖关系字典 `deps`（键为模块名，值为它 import 的模块名列表），写函数 `has_cycle(deps)`：若依赖图中存在环（意味着依赖方向被破坏）返回 True，否则返回 False。只允许使用标准库。", "answer": "def has_cycle(deps: dict[str, list[str]]) -> bool:\n    WHITE, GRAY, BLACK = 0, 1, 2\n    color = {name: WHITE for name in deps}\n\n    def visit(node: str) -> bool:\n        color[node] = GRAY          # 当前递归栈上\n        for nxt in deps.get(node, []):\n            state = color.get(nxt, BLACK)\n            if state == GRAY:       # 回到了栈上的节点 -> 有环\n                return True\n            if state == WHITE and visit(nxt):\n                return True\n        color[node] = BLACK         # 已完成\n        return False\n\n    return any(color[n] == WHITE and visit(n) for n in list(deps))\n\n\nassert has_cycle({'api': ['service'], 'service': ['repo'], 'repo': []}) is False\nassert has_cycle({'a': ['b'], 'b': ['a']}) is True", "explain": "判分要点：用三色标记区分「未访问 / 在递归栈上 / 已完成」，遇到在栈上的节点才算环；只记「访问过」会把菱形依赖误判成环。"}], "20": [{"qid": "d020q1", "type": "single", "stem": "在 pyproject.toml 里，声明包名、版本与运行时依赖的标准表是哪一个？", "options": ["A  [metadata]", "B  [project]", "C  [setup]", "D  [requirements]"], "answer": "B", "explain": "PEP 621 把项目元数据标准化为 [project] 表，构建后端都读它。其余几个名字不是标准表名，写了也不会被识别。"}, {"qid": "d020q2", "type": "single", "stem": "[build-system] 里 requires 字段的含义是什么？", "options": ["A  运行时必须安装的依赖", "B  构建这个包时构建环境里需要安装的工具", "C  支持的 Python 版本范围", "D  允许发布的目标仓库地址"], "answer": "B", "explain": "requires 只服务于构建过程，会被装进隔离的构建环境。运行时依赖写在 [project].dependencies，二者不要混用。"}, {"qid": "d020q3", "type": "judge", "stem": "把测试与 lint 工具放进 [project.optional-dependencies] 的 dev 组，可以让普通使用者安装这个包时不被迫装上它们。", "answer": true, "explain": "可选依赖默认不装，只有显式指定该组（如 `uv pip install -e \".[dev]\"`）时才一起安装，从而把开发工具与运行时依赖分开。"}, {"qid": "d020q4", "type": "fill", "stem": "[build-system] 表中，指定提供构建钩子的模块路径的键名是 ____（填键名本身）。", "answer": ["build-backend", "build_backend"], "explain": "build-backend 指向真正的构建实现（如 setuptools.build_meta），requires 只负责把这个实现装好。"}, {"qid": "d020q5", "type": "code", "stem": "写函数 `runtime_deps(toml_text: str) -> list[str]`：解析 pyproject.toml 文本，返回运行时依赖列表（不含可选分组），名字按字母序排列。只允许使用标准库。", "answer": "import tomllib\n\ndef runtime_deps(toml_text: str) -> list[str]:\n    data = tomllib.loads(toml_text)\n    project = data.get(\"project\", {})\n    return sorted(project.get(\"dependencies\", []))\n\n\nPYPROJECT = '''\n[project]\nname = \"demo\"\ndependencies = [\"httpx\", \"fastapi\"]\n\n[project.optional-dependencies]\ndev = [\"pytest\"]\n'''\nprint(runtime_deps(PYPROJECT))   # ['fastapi', 'httpx']", "explain": "判分要点：用标准库 tomllib（而非第三方 toml 库）读取，从 [project].dependencies 取值；读成 optional-dependencies 或把 dev 组算进来都不合格。"}], "21": [{"qid": "d021q1", "type": "single", "stem": "锁文件（lock file）相比在 pyproject.toml 里写依赖范围，额外保证了什么？", "options": ["A  让依赖下载速度更快", "B  记录整棵依赖图的精确版本与哈希，使任何机器装出同一套依赖", "C  自动把依赖升级到最新版", "D  减小最终产物的体积"], "answer": "B", "explain": "范围只是约束，解析结果会随时间漂移。锁文件把一次解析的结果固定下来（含传递依赖与哈希），才谈得上可复现。"}, {"qid": "d021q2", "type": "single", "stem": "CI 里希望「锁文件与 pyproject.toml 不一致时直接失败、且不重新解析」，应使用哪条命令？", "options": ["A  uv lock", "B  uv sync --frozen", "C  uv pip install -e .", "D  uv sync（不带参数）"], "answer": "B", "explain": "uv lock 会重新解析并改写锁文件，uv sync 默认也可能更新锁文件；--frozen 禁用重新解析，锁文件过期即报错，正是 CI 需要的语义。"}, {"qid": "d021q3", "type": "judge", "stem": "uv.lock 应当提交进版本库，而 .venv/ 不应当提交。", "answer": true, "explain": "锁文件是团队共享的依赖快照，必须入库才能复现；虚拟环境是可随时重建的产物，入库只会带来冲突与体积问题。"}, {"qid": "d021q4", "type": "fill", "stem": "uv 默认把解析好的依赖快照写入的锁文件名是 ____。", "answer": ["uv.lock"], "explain": "默认锁文件名就是 uv.lock，与 pyproject.toml 同级，随项目一起提交。"}, {"qid": "d021q5", "type": "code", "stem": "写函数 `check_locked(project_deps, locked_names) -> list[str]`：project_deps 是 pyproject 里声明的依赖字符串列表（可能形如「包名」或「包名>=某版本」），locked_names 是锁文件中已记录的包名集合。返回没有对应锁记录的依赖名列表。包名比较不区分大小写。只用标准库。", "answer": "import re\n\ndef _name(spec: str) -> str:\n    # 截断到第一个版本约束 / extra / 环境标记字符之前\n    return re.split(r\"[<>=!~\\[; ]\", spec.strip(), maxsplit=1)[0].lower()\n\ndef check_locked(project_deps: list[str], locked_names: set[str]) -> list[str]:\n    locked = {n.lower() for n in locked_names}\n    return [d for d in project_deps if _name(d) not in locked]\n\n\nassert check_locked([\"httpx>=1\", \"pytest\", \"Ruff\"], {\"httpx\", \"ruff\"}) == [\"pytest\"]", "explain": "判分要点：必须先剥掉版本约束、extra 与环境标记再比较，并且大小写不敏感；直接字符串相等会漏判带约束和驼峰拼写的依赖。"}], "22": [{"qid": "d022q1", "type": "single", "stem": "在模块里获取 logger 的推荐写法是？", "options": ["A  logging.getLogger()", "B  logging.getLogger(__name__)", "C  logging.getLogger(\"root\")", "D  logging.getLogger(__file__)"], "answer": "B", "explain": "用 __name__ 得到的名字就是模块路径，天然构成父子层级，可以按包或模块单独调级别，也便于在日志里定位来源。"}, {"qid": "d022q2", "type": "single", "stem": "同一条日志在终端被打了两遍，最可能的原因是什么？", "options": ["A  日志级别被设成了 DEBUG", "B  库与入口各自加了一个 handler，消息沿两条链路各输出一次", "C  代码里写了两行 logger.info", "D  格式化字符串写错了"], "answer": "B", "explain": "propagate 默认开启，消息会继续上传给祖先 logger；库自己加了 handler 又让入口配置了 root，就会出现重复输出。"}, {"qid": "d022q3", "type": "judge", "stem": "一个供他人 import 的工具库，应该在包内直接调用 logging.basicConfig() 把格式配好，方便使用方开箱即用。", "answer": false, "explain": "basicConfig 配置的是全局 root logger，属于应用入口的职责。库这样做会覆盖使用方的日志配置，还会造成重复输出。"}, {"qid": "d022q4", "type": "fill", "stem": "在模块中获取与其模块路径同名的 logger：`logging.getLogger(____)`（填括号内的表达式）。", "answer": ["__name__"], "explain": "模块级内置变量 __name__ 在包内是完整点分路径，在脚本里是 '__main__'，正好符合分层命名的需要。"}, {"qid": "d022q5", "type": "code", "stem": "写函数 `configure_logging(level=logging.INFO)`：让 root logger 使用一个 StreamHandler，格式为 `%(asctime)s %(levelname)s %(name)s %(message)s`，并把级别设为 level。要求重复调用不会叠加 handler。只用标准库。", "answer": "import logging\n\ndef configure_logging(level: int = logging.INFO) -> None:\n    root = logging.getLogger()\n    if not root.handlers:                 # 只配置一次\n        handler = logging.StreamHandler()\n        handler.setFormatter(logging.Formatter(\n            \"%(asctime)s %(levelname)s %(name)s %(message)s\"))\n        root.addHandler(handler)\n    root.setLevel(level)\n\n\nconfigure_logging()\nconfigure_logging()\nassert len(logging.getLogger().handlers) == 1", "explain": "判分要点：添加 handler 前先判断是否已配置（检查 handlers 或用一个模块级标志）。直接 addHandler 会让每次调用都新挂一个 handler，同一条日志被打印多次。"}], "23": [{"qid": "d023q1", "type": "single", "stem": "关于 .env 与 .env.example，正确的做法是？", "options": ["A  两个都提交，方便新人直接使用", "B  .env 提交、.env.example 不提交", "C  .env 加入 .gitignore，.env.example 提交且只含占位值", "D  两个都不提交"], "answer": "C", "explain": "真实值随环境变化且可能含密钥，不能入库；键名清单入库才能让新人知道需要配哪些项，也能在评审时发现配置新增。"}, {"qid": "d023q2", "type": "single", "stem": "判断一个值应该放进环境变量还是写进代码，最合适的标准是？", "options": ["A  这个值是否敏感", "B  这个值是否会随部署环境变化", "C  这个值是不是字符串", "D  这个值是否超过 20 个字符"], "answer": "B", "explain": "12-Factor 的划分依据是「随部署变化」。敏感值当然也在其中，但标准是变化性——一个不含密钥的环境相关地址同样应该外置。"}, {"qid": "d023q3", "type": "judge", "stem": "某个密钥曾经被提交进 Git 历史，只要在最新一次提交里把它删掉，就已经安全了。", "answer": false, "explain": "历史提交仍然可以检出，任何拿到仓库的人都能读到。正确做法是立即轮换该密钥，把旧值作废。"}, {"qid": "d023q4", "type": "fill", "stem": "12-Factor 要求把配置存放在 ____ 变量中，而不是写死在代码里（中文或英文，填一个词）。", "answer": ["环境", "环境变量", "env", "environment"], "explain": "第三条 Factor 即 Config：配置以环境变量的形式注入进程，代码本身不区分开发/生产。"}, {"qid": "d023q5", "type": "code", "stem": "写函数 `load_settings(env) -> dict`：从传入的 env 映射读取 DATABASE_URL（必需）与 PORT（可选，默认 8000）。DATABASE_URL 缺失或为空时抛 RuntimeError；PORT 无法转成整数时抛 ValueError；返回 {'database_url': ..., 'port': int(...)}。只用标准库。", "answer": "def load_settings(env: dict[str, str]) -> dict:\n    url = env.get(\"DATABASE_URL\", \"\").strip()\n    if not url:\n        raise RuntimeError(\"缺少必需的环境变量 DATABASE_URL\")\n    raw = env.get(\"PORT\", \"8000\").strip() or \"8000\"\n    try:\n        port = int(raw)\n    except ValueError as exc:\n        raise ValueError(f\"PORT 不是合法整数: {raw!r}\") from exc\n    return {\"database_url\": url, \"port\": port}\n\n\nassert load_settings({\"DATABASE_URL\": \"postgres://localhost/app\"})[\"port\"] == 8000", "explain": "判分要点：从传入的 env 读而不是直接读 os.environ（这样测试可注入）；必需项缺失抛 RuntimeError；端口解析失败要抛出而不是静默兜底成默认值。"}], "24": [{"qid": "d024q1", "type": "single", "stem": "发现 `repositories/` 层的模块 import 了 `services/` 层的类，最合适的修法是？", "options": ["A  把 services 里的逻辑复制一份到 repositories，避免 import", "B  让数据层依赖一个由业务层定义的抽象（如 Protocol），或把双方共用的逻辑下沉为独立模块", "C  把 services 目录移动进 repositories 目录", "D  在文件顶部加注释说明这是特例"], "answer": "B", "explain": "越层的根因是下层依赖了上层。用抽象反转依赖、或把共用概念下沉，都能恢复单一依赖方向；复制代码与改目录都只是掩盖问题。"}, {"qid": "d024q2", "type": "single", "stem": "下面哪一条日志调用最可能把敏感信息写进日志文件？", "options": ["A  logger.info(\"order reassigned\", extra={\"order_no\": no})", "B  logger.exception(\"支付回调处理失败\")", "C  logger.info(f\"调用支付网关失败，token={token}\")", "D  logger.warning(\"第 3 次重试\")"], "answer": "C", "explain": "把令牌拼进消息文本会原样落盘，且无法在采集侧统一屏蔽。可变信息应走 extra 字段并配合掩码过滤。"}, {"qid": "d024q3", "type": "judge", "stem": "在 CI 里执行 `uv sync --frozen`，可以在 pyproject.toml 与 uv.lock 不一致时直接失败，避免产出与测试环境不一致的依赖。", "answer": true, "explain": "--frozen 禁止重新解析，锁文件过期即报错。这样 CI 用的是被评审过的快照，而不是当场解析出的新版本。"}, {"qid": "d024q4", "type": "fill", "stem": "标准库中保存当前进程环境变量的映射对象是 `os.____`（填属性名）。", "answer": ["environ"], "explain": "os.environ 是环境变量的映射视图，读它也就把配置来源固定成了环境，方便测试时替换。"}, {"qid": "d024q5", "type": "code", "stem": "写一个 logging.Filter 子类 `MaskSecrets`：当 `record.args` 是字典时，把键名含 token、password、secret（不区分大小写）的值替换为 `'***'`，并始终返回 True。只用标准库。", "answer": "import logging\n\nSENSITIVE = (\"token\", \"password\", \"secret\")\n\nclass MaskSecrets(logging.Filter):\n    def filter(self, record: logging.LogRecord) -> bool:\n        if isinstance(record.args, dict):\n            record.args = {\n                k: (\"***\" if any(s in k.lower() for s in SENSITIVE) else v)\n                for k, v in record.args.items()\n            }\n        return True\n\n\nrec = logging.LogRecord(\"svc\", logging.INFO, \"svc.py\", 1,\n                        \"%(api_token)s %(order)s\",\n                        {\"api_token\": \"abc\", \"order\": \"A1\"}, None)\nMaskSecrets().filter(rec)\nassert rec.args[\"api_token\"] == \"***\" and rec.args[\"order\"] == \"A1\"", "explain": "判分要点：必须返回 True，否则这条日志被直接丢掉；键名匹配要不区分大小写；args 不是字典（例如元组）时应原样放行。"}], "25": [{"qid": "d025q1", "type": "single", "stem": "一个任务 95% 的时间在等待数据库和外部接口返回，单机需要维持数千个并发连接。最合适的方案是：", "options": ["A  用 multiprocessing 起多个进程，每进程处理一部分连接", "B  用 asyncio 协程，在等待 IO 时交出控制权", "C  用 threading 为每个连接开一个线程，连接数不设上限", "D  把循环改成列表推导式以提升单机吞吐"], "answer": "B", "explain": "瓶颈在等待而非计算，协程的单线程并发切换成本最低，能承载大量并发 IO。进程解决的是 CPU 并行，每进程成本高；每连接一线程在数千并发下线程开销与上下文切换会成为瓶颈。"}, {"qid": "d025q2", "type": "single", "stem": "关于 CPython 的 GIL，下列说法正确的是：", "options": ["A  GIL 使任何情况下多个线程都无法同时提升吞吐", "B  线程执行阻塞式系统调用（如读写 socket、sleep）时会释放 GIL", "C  GIL 是语言规范的一部分，所有 Python 实现都必须有", "D  只要在函数里加 `global` 声明就能绕开 GIL"], "answer": "B", "explain": "GIL 只保证同一时刻只有一个线程执行字节码，遇到阻塞式 IO 会主动释放，所以多线程对 IO 密集有效。GIL 是实现细节（CPython 特有），且没有任何语法能绕开它。"}, {"qid": "d025q3", "type": "judge", "stem": "因为存在 GIL，Python 多线程在任何场景下都无法提升性能，所以项目中应当完全禁止使用多线程。", "answer": false, "explain": "IO 等待期间线程会释放 GIL，多线程对 IO 密集仍有明显收益；GIL 的限制主要落在纯 Python 字节码的 CPU 密集任务上，那类任务才应改用多进程。"}, {"qid": "d025q4", "type": "fill", "stem": "CPython 中保证同一进程内同一时刻只有一个线程执行字节码的机制，英文缩写是 ____。", "answer": ["GIL", "Global Interpreter Lock", "全局解释器锁"], "explain": "GIL 即 Global Interpreter Lock（全局解释器锁），是 CPython 的实现细节，不是语言规范要求。"}, {"qid": "d025q5", "type": "code", "stem": "写一段完整可运行的脚本（6–10 行）：用 `concurrent.futures` 中的 `ProcessPoolExecutor` 并发执行 4 个 CPU 密集任务，其中 `heavy(x)` 返回 0 到 x-1 的平方和；收集并打印结果列表。注意入口保护。", "answer": "from concurrent.futures import ProcessPoolExecutor\n\ndef heavy(x):\n    return sum(i * i for i in range(x))\n\nif __name__ == \"__main__\":\n    with ProcessPoolExecutor(max_workers=4) as pool:\n        results = list(pool.map(heavy, [10000, 20000, 30000, 40000]))\n    print(results)", "explain": "判分要点：CPU 密集必须用进程池（线程池受 GIL 限制无法真正并行），用 ThreadPoolExecutor 不给分；被提交函数需可 pickle，故要模块级定义；入口加 `if __name__ == \"__main__\"` 保护，否则 spawn 平台会重复导入引发递归启动。"}], "26": [{"qid": "d026q1", "type": "single", "stem": "关于 asyncio 事件循环的调度方式，下列描述正确的是：", "options": ["A  事件循环会按固定时间片抢占正在运行的协程", "B  协程在 await 一个未完成的对象时挂起，把控制权交回事件循环", "C  事件循环会在没有 IO 事件时持续空转，以降低响应延迟", "D  每个协程运行在独立的操作系统线程里"], "answer": "B", "explain": "协程调度是协作式的，只在不满足继续执行条件（如等待 Future）时挂起。事件循环不与协程抢时间片，空闲时阻塞在 selector 上而不是空转，且所有协程默认跑在同一个线程里。"}, {"qid": "d026q2", "type": "single", "stem": "某个协程里写了一句 `time.sleep(3)`（不是 `asyncio.sleep`）。这 3 秒内同一事件循环上的其它任务会：", "options": ["A  照常运行，因为事件循环会自动切到其它协程", "B  全部被阻塞，直到这次 sleep 结束才可能被调度", "C  被自动转移到线程池执行", "D  抛出 RuntimeError 终止程序"], "answer": "B", "explain": "time.sleep 是同步阻塞调用，会占住运行事件循环的那个线程，循环无法推进，其它任务全部停摆。要正确挂起必须用 await asyncio.sleep。"}, {"qid": "d026q3", "type": "judge", "stem": "协程是协作式调度，因此一个不含任何 await 的长循环会让同一事件循环上的其它任务全部得不到执行。", "answer": true, "explain": "协作式调度的让出点只有 await。不含 await 的纯计算循环不会把控制权交回事件循环，同线程上的所有任务都会一起被卡住。"}, {"qid": "d026q4", "type": "fill", "stem": "在协程中挂起指定秒数、把控制权交回事件循环的写法是 `await asyncio.____(1)`（填函数名）。", "answer": ["sleep"], "explain": "asyncio.sleep 是异步版的非阻塞等待；time.sleep 会同步阻塞整个事件循环所在线程。"}, {"qid": "d026q5", "type": "code", "stem": "写一段可直接运行的代码（6–10 行）：定义协程 `tick(name, delay)`，内部循环 3 次，每次先 `print(name)` 再 `await asyncio.sleep(delay)`；在 `main()` 中用 `asyncio.gather` 同时运行 `tick(\"A\", 0.1)` 与 `tick(\"B\", 0.1)`。", "answer": "import asyncio\n\nasync def tick(name, delay):\n    for _ in range(3):\n        print(name)\n        await asyncio.sleep(delay)\n\nasync def main():\n    await asyncio.gather(tick(\"A\", 0.1), tick(\"B\", 0.1))\n\nasyncio.run(main())", "explain": "判分要点：必须用 gather（或 create_task）让两个协程同时注册进事件循环，A/B 打印才会交错；写成 `await tick(\"A\", ...)` 再 `await tick(\"B\", ...)` 是串行执行，总耗时翻倍，不给分。sleep 必须是 asyncio.sleep。"}], "27": [{"qid": "d027q1", "type": "single", "stem": "`async def f(): ...` 之后只写一句 `f()`（没有 await、没有放进任务）会怎样？", "options": ["A  函数体正常执行，只是返回值被丢弃", "B  返回一个协程对象，函数体不会执行，可能在回收时出现 RuntimeWarning", "C  立即抛出 TypeError", "D  函数体执行到第一个 await 处后暂停"], "answer": "B", "explain": "async def 函数调用只构造协程对象，不会驱动执行；未被 await 的协程对象被回收时 Python 会给出 was never awaited 警告。要执行必须 await 或交给事件循环。"}, {"qid": "d027q2", "type": "single", "stem": "要让两个协程真正并发执行（总耗时接近单个耗时），正确的写法是：", "options": ["A  `await coro_a(); await coro_b()`", "B  `t1 = asyncio.create_task(coro_a()); t2 = asyncio.create_task(coro_b()); await t1; await t2`", "C  `asyncio.run(coro_a()); asyncio.run(coro_b())`", "D  在协程里调用 `threading.Thread(target=coro_a).start()`"], "answer": "B", "explain": "create_task 会立刻把协程排进事件循环，两个任务交替推进；A 是串行等待，C 会为每个协程新建并关闭事件循环（且嵌套调用会报错），D 直接跑协程对象不会执行其函数体。"}, {"qid": "d027q3", "type": "judge", "stem": "在 `async def` 内部调用 `time.sleep(1)`，只会阻塞当前协程，同一事件循环上的其它任务不受影响。", "answer": false, "explain": "time.sleep 是同步阻塞，占住的是运行事件循环的线程，其它所有任务都会一起停摆。要挂起当前协程必须用 await asyncio.sleep。"}, {"qid": "d027q4", "type": "fill", "stem": "把一个同步阻塞函数放到线程中执行、从而不阻塞事件循环的 asyncio 函数是 `await asyncio.____(blocking_func, arg)`（填函数名）。", "answer": ["to_thread"], "explain": "asyncio.to_thread 是 run_in_executor 的便捷封装，把阻塞函数交给线程池并 await 其结果，事件循环在这期间可继续调度其它任务。"}, {"qid": "d027q5", "type": "code", "stem": "给定同步函数 `def blocking(x): time.sleep(0.5); return x * 2`。写一段可直接运行的代码：在协程 `main()` 中用 `asyncio.to_thread` 让 `blocking(3)` 与 `blocking(4)` 并发执行（总耗时约 0.5 秒），最后打印两者之和。5–9 行。", "answer": "import asyncio, time\n\ndef blocking(x):\n    time.sleep(0.5)\n    return x * 2\n\nasync def main():\n    a, b = await asyncio.gather(\n        asyncio.to_thread(blocking, 3),\n        asyncio.to_thread(blocking, 4),\n    )\n    print(a + b)   # 14\n\nasyncio.run(main())", "explain": "判分要点：必须用 asyncio.to_thread 包住同步函数（直接 `blocking(3)` 会阻塞事件循环），两个调用要通过 gather 或 create_task 并发；只要出现同步调用直接写在协程体里就不给分。"}], "28": [{"qid": "d028q1", "type": "single", "stem": "要求同一时刻最多只有 5 个协程在调用外部接口，正确做法是：", "options": ["A  在 gather 外面套一层 `asyncio.Semaphore(5).acquire()`", "B  用 `sem = asyncio.Semaphore(5)`，在每个协程内部 `async with sem:` 包住请求调用", "C  用 `asyncio.sleep(0.2)` 在每个请求前限速", "D  把协程数量减到 5 个，其它请求直接丢弃"], "answer": "B", "explain": "Semaphore 的语义是进入临界区的协程数受限，因此必须在每个协程内部、包住真正的 await 调用。放在 gather 外层只会在启动阶段阻塞一次，限流不生效。"}, {"qid": "d028q2", "type": "single", "stem": "要让协程 `do()` 最多执行 5 秒、超时抛出 TimeoutError，下列写法正确的是：", "options": ["A  `await asyncio.wait_for(do(), timeout=5)`", "B  `await asyncio.wait(do(), timeout=5)`", "C  `await do(); await asyncio.sleep(5)`", "D  `asyncio.run(do(), timeout=5)`"], "answer": "A", "explain": "wait_for 接受可等待对象并返回其结果，超时取消任务并抛 TimeoutError。asyncio.wait 只接受任务或 Future 集合（传协程对象会直接报错），C 只是顺序执行不构成超时，D 的 asyncio.run 没有 timeout 参数。"}, {"qid": "d028q3", "type": "judge", "stem": "为了让任务尽快跑完，应当把所有 URL 一次性 gather 起来，不必限制并发数。", "answer": false, "explain": "并发无上限会耗尽文件描述符与内存，并把下游打挂，反而拉高整体失败率与延迟。并发数是需要按下游承载能力设定的有界参数。"}, {"qid": "d028q4", "type": "fill", "stem": "限制同时进入临界区的协程数量 N，使用的同步原语是 `asyncio.____(N)`（填类名）。", "answer": ["Semaphore"], "explain": "asyncio.Semaphore 维护一个计数，acquire 时递减、release 时递增，计数为 0 时等待；适合做并发上限控制。"}, {"qid": "d028q5", "type": "code", "stem": "写一段可直接运行的代码（8–14 行）：用 `asyncio.Semaphore(2)` 限流，对 1、2、3、4 四个数字并发执行协程 `job(i)`（内部 `await asyncio.sleep(0.1)` 后返回 i 的平方）；每个任务再加 1 秒超时（`asyncio.wait_for`），最后打印结果列表。", "answer": "import asyncio\n\nasync def job(i):\n    await asyncio.sleep(0.1)\n    return i * i\n\nasync def main():\n    sem = asyncio.Semaphore(2)\n\n    async def guarded(i):\n        async with sem:\n            return await asyncio.wait_for(job(i), timeout=1.0)\n\n    print(await asyncio.gather(*(guarded(i) for i in (1, 2, 3, 4))))\n\nasyncio.run(main())", "explain": "判分要点：`async with sem` 必须包住包含 wait_for 的整段 await 逻辑，包在外面限流就无效；gather 要用 `*(...)` 解包生成器；漏掉 wait_for 或超时值写成 job 内部的 sleep 时长都不给分。"}], "29": [{"qid": "d029q1", "type": "single", "stem": "`await asyncio.gather(t1, t2, t3)`（未传 return_exceptions）中 t2 抛出异常时，会发生什么？", "options": ["A  三个任务全部被自动取消，gather 抛出该异常", "B  gather 立刻把该异常抛给等待方，t1 与 t3 不会被自动取消，仍在后台运行", "C  异常被忽略，gather 返回其余任务的结果", "D  gather 阻塞到三个任务全部结束再抛出异常"], "answer": "B", "explain": "默认模式下 gather 遇到第一个异常就向等待方抛出，但它不会取消兄弟任务；这些任务继续在后台执行，直到事件循环关闭时才被取消。要收集全部结果需传 return_exceptions=True。"}, {"qid": "d029q2", "type": "single", "stem": "希望即使某个子任务失败，也要拿到其它子任务的正常结果，应该：", "options": ["A  把 gather 换成 asyncio.wait_for", "B  `await asyncio.gather(*tasks, return_exceptions=True)`，再自行过滤异常对象", "C  在每个协程里用 try/except 把异常转成 None 返回", "D  用 asyncio.sleep 等待所有任务结束后读取返回值"], "answer": "B", "explain": "return_exceptions=True 让异常作为结果项出现在列表中，正常结果不会丢失。C 虽然可行但会把异常信息抹平成 None，丢失失败原因；A、D 与收集结果无关。"}, {"qid": "d029q3", "type": "judge", "stem": "asyncio.CancelledError 是 Exception 的子类，因此 `except Exception` 能捕获它。", "answer": false, "explain": "CancelledError 继承自 BaseException 而不是 Exception，这是刻意设计：避免宽泛的异常兜底把取消吞掉，导致任务停不下来。捕获后应完成清理并继续向上抛出。"}, {"qid": "d029q4", "type": "fill", "stem": "要让 `asyncio.gather` 把子任务的异常当作结果返回而不是直接抛出，应传入参数 `____=True`（填参数名）。", "answer": ["return_exceptions"], "explain": "return_exceptions=True 时异常对象混在结果列表里返回，调用方需要自行用 isinstance 判断哪一项是异常。"}, {"qid": "d029q5", "type": "code", "stem": "写一段可直接运行的代码（8–12 行）：三个协程由同一个 `work(i)` 生成，其中 i 为 2 时 `raise RuntimeError(\"boom\")`，其它情况 `await asyncio.sleep(0.01)` 后返回 i。用 `asyncio.gather(..., return_exceptions=True)` 收集结果，并打印「正常返回值的个数」（应为 2）。", "answer": "import asyncio\n\nasync def work(i):\n    if i == 2:\n        raise RuntimeError(\"boom\")\n    await asyncio.sleep(0.01)\n    return i\n\nasync def main():\n    rs = await asyncio.gather(*(work(i) for i in (1, 2, 3)), return_exceptions=True)\n    print(sum(1 for r in rs if not isinstance(r, BaseException)))\n\nasyncio.run(main())", "explain": "判分要点：必须传 return_exceptions=True，否则异常直接抛出、拿不到结果列表；过滤要基于异常是对象这一事实，用 isinstance(r, BaseException) 判断，写 `if r` 或 `r is not None` 会把返回 0 的正常结果也误判。"}], "30": [{"qid": "d030q1", "type": "single", "stem": "一个服务 90% 的时间在等待数据库与第三方接口，单机需要支撑数千个并发连接。最合适的实现方案是：", "options": ["A  multiprocessing 起 8 个进程，每进程撑一部分连接", "B  asyncio 协程配合异步驱动，并用 Semaphore 限制单次对外并发数", "C  threading 每连接一线程，不做上限控制", "D  开启 free-threaded 构建后继续用每连接一线程"], "answer": "B", "explain": "瓶颈在等待，协程的切换成本最低且能承载大量并发；同时对外调用必须有界，避免打挂下游。进程适合 CPU 并行，每连接一线程在数千并发下开销过大，free-threaded 解决的是字节码并行而非 IO 等待。"}, {"qid": "d030q2", "type": "single", "stem": "以下代码在执行时会报错，原因是：\\n\\n```python\\nawait asyncio.gather(fetch(u) for u in urls)\\n```", "options": ["A  gather 要求传位置参数，必须先解包：`gather(*(fetch(u) for u in urls))`", "B  gather 不能用于协程，只能接收 Task 对象", "C  生成器表达式不能在 await 语句里使用", "D  fetch 返回值必须是 Future 而不能是协程"], "answer": "A", "explain": "gather 的签名接受若干可等待对象（*aws），直接传一个生成器对象会被当作单个不可等待对象而报错，所以必须用 `*` 解包。列表推导式同样需要解包。"}, {"qid": "d030q3", "type": "judge", "stem": "在协程里调用同步的 requests.get() 只会阻塞当前协程，同一事件循环上的其它任务能够继续运行。", "answer": false, "explain": "同步调用占住的是运行事件循环的线程，所有任务一起停摆。正确做法是换异步客户端，或用 asyncio.to_thread 把阻塞调用移出事件循环。"}, {"qid": "d030q4", "type": "fill", "stem": "协程把控制权交回事件循环、并驱动被等待对象执行的关键字是 ____。", "answer": ["await"], "explain": "await 是协程唯一的挂起点与让出点：它驱动被等待对象执行，必要时挂起当前协程并交还控制权。"}, {"qid": "d030q5", "type": "code", "stem": "综合题（10–18 行）：协程 `handle(i)` 内部先 `await asyncio.sleep(0.05)`，若 `i == 3` 则抛 `ValueError`，否则返回 i。写 `main()`：用 `asyncio.Semaphore(2)` 限制并发、对每个任务加 0.5 秒超时、用 `return_exceptions=True` 收集全部结果，最后打印「成功个数」与「异常个数」（应为 4 与 1）。", "answer": "import asyncio\n\nasync def handle(i):\n    await asyncio.sleep(0.05)\n    if i == 3:\n        raise ValueError(f\"bad {i}\")\n    return i\n\nasync def main():\n    sem = asyncio.Semaphore(2)\n\n    async def guarded(i):\n        async with sem:\n            return await asyncio.wait_for(handle(i), timeout=0.5)\n\n    rs = await asyncio.gather(*(guarded(i) for i in (1, 2, 3, 4, 5)), return_exceptions=True)\n    ok = sum(1 for r in rs if not isinstance(r, BaseException))\n    print(ok, len(rs) - ok)   # 4 1\n\nasyncio.run(main())", "explain": "判分要点：三件事缺一不可——sem 包住含 wait_for 的临界区、wait_for 给每个任务独立超时、gather 传 return_exceptions=True；统计异常要用 isinstance(r, BaseException)，否则 ValueError 与超时 TimeoutError 都会被算成成功。"}], "31": [{"qid": "d031q1", "type": "single", "stem": "一批任务只做数值计算，不涉及任何 IO，单次耗时约 200ms。要在多核机器上缩短总耗时，最合适的做法是：", "options": ["A  用 ThreadPoolExecutor 并把 max_workers 设成核数的 4 倍", "B  用 ProcessPoolExecutor，把任务拆成模块级函数提交", "C  在主线程里用 asyncio.gather 并发跑这批计算", "D  给计算函数加锁后用多线程调用"], "answer": "B", "explain": "纯计算不释放 GIL，线程再多也只有一条字节码执行线，加锁更会串行化。进程池每个 worker 有独立解释器，能让多核真正并行。"}, {"qid": "d031q2", "type": "single", "stem": "需要提交 100 个任务，并按它们完成的先后顺序立刻处理结果，应该用哪个 API？", "options": ["A  executor.map", "B  executor.submit 后配合 as_completed", "C  asyncio.gather", "D  executor.shutdown"], "answer": "B", "explain": "as_completed 按完成顺序产出 Future；map 按输入顺序返回结果，慢任务会挡住后面的结果；gather 是协程世界的 API，与线程池无关。"}, {"qid": "d031q3", "type": "judge", "stem": "把纯 CPU 密集的计算放进 ThreadPoolExecutor，只要 max_workers 开到 CPU 核数以上，就能得到接近线性加速。", "answer": false, "explain": "CPython 的 GIL 保证同一时刻只有一个线程执行字节码，多线程无法并行做计算，只会增加上下文切换与调度开销。"}, {"qid": "d031q4", "type": "fill", "stem": "进程池在把入参与返回值送往 worker 时需要序列化，CPython 默认使用的标准库协议名是 ____（填库名）。", "answer": ["pickle", "pickle 模块", "pickle协议"], "explain": "跨进程传递要经过 pickle 序列化，因此 lambda、嵌套函数与打开的连接对象都无法提交；线程池不需要这一步。"}, {"qid": "d031q5", "type": "code", "stem": "用 concurrent.futures 实现函数 `cpu_parallel(nums, workers=4)`：以进程池并行计算每个数的平方，并按输入顺序返回结果列表。需要保留一个可被 pickle 的模块级计算函数。", "answer": "from concurrent.futures import ProcessPoolExecutor\n\ndef square(n):\n    return n * n\n\ndef cpu_parallel(nums, workers=4):\n    with ProcessPoolExecutor(max_workers=workers) as ex:\n        return list(ex.map(square, nums))", "explain": "判分要点：用 ProcessPoolExecutor（线程池视为放错）、map 保序、`with` 保证池被关闭；计算函数必须是模块级可 pickle 的函数，用 lambda 不得分。"}], "32": [{"qid": "d032q1", "type": "single", "stem": "一个服务每处理一次请求都新建 HTTPS 连接，改成复用连接后延迟明显下降。下降主要来自：", "options": ["A  服务端少做了一次业务逻辑计算", "B  省掉了 TCP 与 TLS 握手等连接建立成本", "C  Python 解释器少做了一次字节码编译", "D  请求体被自动压缩，传输字节数减少"], "answer": "B", "explain": "连接建立含 TCP 三次握手与 TLS 握手，往往比小请求本身的往返更贵；复用连接后这部分成本只在首次支付。"}, {"qid": "d032q2", "type": "single", "stem": "数据库连接池的容量上限最应该依据什么来设定？", "options": ["A  本地机器的 CPU 核数乘以 4", "B  应用实例的线程池 worker 数量再乘 2", "C  数据库允许的最大连接数与自身业务并发量", "D  越大越好，先设成 500 再观察"], "answer": "C", "explain": "连接是外部有状态资源，池上限超过数据库承受能力会把压力变成排队、超时甚至拒绝服务；应按对端容量与真实并发设定。"}, {"qid": "d032q3", "type": "judge", "stem": "requests 的 Session 在多线程中共享使用是安全的，因为它内部已经做了连接池同步。", "answer": false, "explain": "requests 文档明确 Session 不是线程安全的（cookie 与会话状态可能互相污染）；线程池场景中应每线程一个 Session，或改用 httpx.Client。"}, {"qid": "d032q4", "type": "fill", "stem": "在 requests 中复用连接池与默认请求头的对象类名是 ____（填类名）。", "answer": ["Session", "requests.Session"], "explain": "Session 持有连接池与默认配置，进程内复用一个实例即可跨请求复用底层连接；直接 requests.get 每次都会新建会话。"}, {"qid": "d032q5", "type": "code", "stem": "用标准库实现 `ResourcePool` 类：`__init__(self, factory, size)` 保存创建函数与容量；`acquire()` 优先复用空闲对象，空闲为空时调用 factory 新建；`release(obj)` 在空闲数未达容量时放回，否则调用 `obj.close()`。", "answer": "import queue\n\nclass ResourcePool:\n    def __init__(self, factory, size):\n        self.factory = factory\n        self.size = size\n        self.idle = queue.LifoQueue()\n\n    def acquire(self):\n        try:\n            return self.idle.get_nowait()\n        except queue.Empty:\n            return self.factory()\n\n    def release(self, obj):\n        if self.idle.qsize() < self.size:\n            self.idle.put(obj)\n        else:\n            obj.close()", "explain": "判分要点：用 queue 容器保存空闲对象（LifoQueue 或 Queue 均可）、acquire 先取后建、release 有容量判断且超容量时 close；用普通 list 加锁也可接受，但必须线程安全。"}], "33": [{"qid": "d033q1", "type": "single", "stem": "用 pstats 打印剖析结果时，想直接找出“自身代码耗时最长”的函数，应该按哪个字段排序？", "options": ["A  ncalls（调用次数）", "B  tottime（函数自身耗时）", "C  cumtime（含子调用的累计耗时）", "D  callers（调用者列表）"], "answer": "B", "explain": "tottime 只算函数自身的执行时间，排除子调用干扰，最适合定位热点本体；cumtime 会被下游耗时大的子调用带偏。"}, {"qid": "d033q2", "type": "single", "stem": "线上一个服务不能停机、也不能改代码，需要非侵入地定位 CPU 热点，最合适的做法是：", "options": ["A  给代码加 cProfile.Profile 包裹后重新发布", "B  用 py-spy attach 到进程做采样并生成火焰图", "C  在关键函数前后打印 time.time()", "D  把日志级别调到 DEBUG 后观察日志量"], "answer": "B", "explain": "py-spy 是采样剖析器，不需要改代码即可 attach 运行中的进程，开销低；cProfile 需要改动代码且有明显开销，日志法无法给出耗时占比。"}, {"qid": "d033q3", "type": "judge", "stem": "用 cProfile 剖析出来的各函数耗时绝对值，可以直接当作生产环境中的真实耗时来评估性能。", "answer": false, "explain": "剖析器本身会带来额外开销（一次函数调用就要记录一次），绝对耗时会明显偏大，只能用来看各部分的相对占比。"}, {"qid": "d033q4", "type": "fill", "stem": "按固定频率抓取调用栈、开销远低于 cProfile 的剖析方式叫 ____ 剖析（填中文或英文）。", "answer": ["采样", "sampling", "采样剖析"], "explain": "采样剖析按时间间隔抓栈并统计占比，py-spy 即此类工具；代价是极短的调用可能采不到，换来的是可安全用于生产。"}, {"qid": "d033q5", "type": "code", "stem": "用标准库实现 `hotspot_names(func, args=(), top=3)`：剖析 `func(*args)` 的执行，返回按函数自身耗时（tottime）降序的前 top 个函数名列表。", "answer": "import cProfile, pstats\n\ndef hotspot_names(func, args=(), top=3):\n    pr = cProfile.Profile()\n    pr.enable()\n    func(*args)\n    pr.disable()\n    stats = pstats.Stats(pr).stats           # {(file, line, func): (cc, nc, tt, ct, callers)}\n    rows = sorted(stats.items(), key=lambda kv: kv[1][2], reverse=True)\n    return [key[2] for key, _ in rows[:top]]", "explain": "判分要点：用 cProfile.Profile 的 enable/disable 包围被测调用；从 pstats.Stats(...).stats 取到元组，按第 3 项（tottime）降序排序后取函数名；用 print_stats 解析文本也可接受。"}], "34": [{"qid": "d034q1", "type": "single", "stem": "要统计一个 2GB 的 JSON 文件里某字段的总和，且进程内存受限，最稳妥的做法是：", "options": ["A  用 json.load 载入后遍历统计", "B  逐行读取（JSONL）或分块解析，边解析边累加", "C  先用 sys.getsizeof 估算内存再决定是否载入", "D  把文件读成一个大字符串后用正则统计"], "answer": "B", "explain": "一次性载入会构建完整对象树，占用常为文本的数倍；流式逐行或分块解析能让常驻内存与控制块大小同量级。"}, {"qid": "d034q2", "type": "single", "stem": "关于 sys.getsizeof 的说法，正确的是：", "options": ["A  它递归统计对象及其所有引用对象的总内存", "B  它只返回对象自身的内存，不含容器引用的元素", "C  它等于进程的常驻内存（RSS）", "D  它对 dict 和 list 会当成字符串处理"], "answer": "B", "explain": "getsizeof 是浅度测量，容器里元素引用的对象不计入，所以通常低估真实占用；要看分配总量应使用 tracemalloc。"}, {"qid": "d034q3", "type": "judge", "stem": "对一个字典执行 json.dumps 再 json.loads 回来，得到的开销可以忽略，因此可以在热点循环里放心使用。", "answer": false, "explain": "序列化与反序列化是 CPU 密集操作，还会产生临时字符串与对象；放进热点循环里会显著拖慢，应构造一次后复用结果。"}, {"qid": "d034q4", "type": "fill", "stem": "类里声明 ____ 可以让实例属性存放在固定槽位中，省去每实例的 __dict__ 开销（填类属性名）。", "answer": ["__slots__", "__slots__ = ()", "slots"], "explain": "__slots__ 把属性存到固定槽位，海量小对象时能显著降低单实例内存；代价是不能动态新增属性。"}, {"qid": "d034q5", "type": "code", "stem": "写函数 `dump_jsonl(records, path)`：把 records（可迭代的 dict）逐条写成 JSON Lines 文件，每行一个 JSON 对象，非 ASCII 字符按原样写入、行尾以换行符结束。要求不在内存中拼出整份文本。", "answer": "import json\n\ndef dump_jsonl(records, path):\n    with open(path, \"w\", encoding=\"utf-8\") as f:\n        for rec in records:\n            f.write(json.dumps(rec, ensure_ascii=False))\n            f.write(\"\\n\")", "explain": "判分要点：逐条序列化并立即写入文件对象（不得先 join 成大字符串）、输出为 UTF-8 且每行一个对象、循环结束后文件自动关闭（with）。"}], "35": [{"qid": "d035q1", "type": "single", "stem": "压测报告中平均延迟 20ms，但 P95 为 500ms。这个结果说明：", "options": ["A  数据矛盾，一定有测量错误", "B  大部分请求很快，但存在明显长尾，少数请求极慢", "C  所有请求都在 20ms 左右，P95 是抽样噪声", "D  应当用中位数替代平均值来掩盖这个问题"], "answer": "B", "explain": "均值被大量快请求拉低，P95 揭示出 5% 的慢请求达到半秒；长尾直接影响用户体验，需要继续排查慢请求的成因。"}, {"qid": "d035q2", "type": "single", "stem": "压测时按 1、10、50、100、200 的并发梯度逐档施压，主要目的是：", "options": ["A  让压测报告看起来更完整", "B  找到吞吐不再增长而延迟开始陡升的容量拐点", "C  降低压测机的 CPU 占用", "D  避免服务端出现任何错误"], "answer": "B", "explain": "单点数据无法判断系统处于线性区还是饱和区；阶梯加压观察吞吐—延迟曲线，才能确定拐点与可用容量。"}, {"qid": "d035q3", "type": "judge", "stem": "当吞吐量不再随并发数增长时，继续加大并发数通常能进一步提升吞吐。", "answer": false, "explain": "吞吐不再增长说明系统已饱和，继续加压只会让请求在队列中堆积，表现为延迟上升与错误率攀升，吞吐可能反而下降。"}, {"qid": "d035q4", "type": "fill", "stem": "“95% 的请求不慢于该延迟值”，这个延迟指标的常见写法是 ____（填缩写）。", "answer": ["p95", "95分位", "第95百分位"], "explain": "P95 是 95 分位延迟，用最近秩法计算；相比平均值它更能反映长尾，是压测报告里最常被要求给出的指标之一。"}, {"qid": "d035q5", "type": "code", "stem": "写函数 `summarize(latencies_ms, errors=0)`：返回一个 dict，包含 `count`（总请求数，含失败）、`avg`（成功请求的延迟均值，无成功请求时为 0.0）、`p95`（按最近秩法计算的 95 分位延迟）与 `error_rate`（失败占比，总数为 0 时为 0.0）。", "answer": "import math\n\ndef summarize(latencies_ms, errors=0):\n    vals = sorted(latencies_ms)\n    total = len(vals) + errors\n    p95 = 0.0\n    if vals:\n        k = max(1, math.ceil(95 / 100 * len(vals)))\n        p95 = vals[k - 1]\n    return {\n        \"count\": total,\n        \"avg\": sum(vals) / len(vals) if vals else 0.0,\n        \"p95\": p95,\n        \"error_rate\": errors / total if total else 0.0,\n    }", "explain": "判分要点：P95 必须先排序再按 ceil(p/100*n) 取最近秩（不能用平均值或 max 代替）；count 要含失败数、error_rate 分母为总数，且空输入不抛异常。"}], "36": [{"qid": "d036q1", "type": "single", "stem": "一个接口 80% 的时间在等下游 HTTP 响应，应用 CPU 利用率不足 20%。现有实现用 ProcessPoolExecutor 包住每个请求并开到 32 个进程，结果内存暴涨而吞吐几乎不变。最合理的改法是：", "options": ["A  把进程数从 32 提到 64", "B  改用 ThreadPoolExecutor，并复用 HTTP 会话", "C  在请求处理函数上加锁，避免竞态", "D  维持现状，改为增加服务器内存"], "answer": "B", "explain": "瓶颈是等待而非计算，等待期会释放 GIL，线程池即可重叠等待且无序列化开销；进程池白付内存与 IPC 成本，加进程数只放大内存。"}, {"qid": "d036q2", "type": "single", "stem": "压测数据：并发 50 时 QPS 1200、P95 60ms、错误率 0.1%；并发 100 时 QPS 1250、P95 700ms、错误率 3%，此时应用进程 CPU 占用约 55%。最符合数据的判断是：", "options": ["A  系统仍在线性区，应继续加到 200 并发以摸清容量上限", "B  吞吐已趋于饱和而延迟与错误率陡升，瓶颈大概率在排队或下游，应先定位再决定是否加压", "C  错误率 3% 属压测机噪声，可以忽略", "D  只要 P95 小于 1 秒就算达标，无需处理"], "answer": "B", "explain": "吞吐几乎不涨而 P95 从 60ms 跳到 700ms、错误率放大 30 倍，同时应用 CPU 仅 55%，说明瓶颈不在应用计算，多半是资源池排队或下游受限。"}, {"qid": "d036q3", "type": "judge", "stem": "处理一个 2GB 的 JSON 文件时，用 json.load 一次性载入内存再逐条处理，峰值内存开销与文件大小处于同一量级。", "answer": false, "explain": "载入后会构建完整的对象树，每个 dict、字符串都有对象头与对齐开销，峰值内存通常是文本的数倍；大文件应逐行或分块流式处理。"}, {"qid": "d036q4", "type": "fill", "stem": "要在不改代码的前提下对线上正在运行的 Python 进程做低开销采样、生成火焰图，常用的命令行工具是 ____（填命令名）。", "answer": ["py-spy", "py spy", "pyspy"], "explain": "py-spy 是按频率抓栈的采样剖析器，支持 attach 运行中的进程（如 py-spy top / py-spy record），开销低；cProfile 需要改代码且有明显开销。"}, {"qid": "d036q5", "type": "code", "stem": "写函数 `run_parallel(func, args_list, max_workers=4)`：用线程池并发执行 `func(*args)`，返回二元组 `(results, failed)`，results 为成功的结果列表，failed 为失败次数。要求单个任务抛异常不影响其他任务，且队列中所有任务都已结束才返回。", "answer": "from concurrent.futures import ThreadPoolExecutor, as_completed\n\ndef run_parallel(func, args_list, max_workers=4):\n    results, failed = [], 0\n    with ThreadPoolExecutor(max_workers=max_workers) as ex:\n        futures = [ex.submit(func, *args) for args in args_list]\n        for fut in as_completed(futures):\n            try:\n                results.append(fut.result())\n            except Exception:\n                failed += 1\n    return results, failed", "explain": "判分要点：用 ThreadPoolExecutor 提交全部任务、通过 as_completed 或逐个 future 取结果、单任务异常被捕获并计入 failed 而不中断其余任务；with 保证退出前所有任务结束。"}], "37": [{"qid": "d037q1", "type": "single", "stem": "已有复合索引 `idx_abc ON orders (a, b, c)`，下面哪条 WHERE 能把三列都用于索引定位？", "options": ["A  WHERE b = 1 AND c = 2", "B  WHERE a = 1 AND c = 3", "C  WHERE a = 1 AND b = 2 AND c = 3", "D  WHERE c = 3"], "answer": "C", "explain": "复合索引按「先 a、再 b、再 c」排序，只有从最左列开始连续给出等值条件时三列都能定位。B 跳过了 b，只用到 a，c 无法定位；A、D 跳过最左列，用不上。"}, {"qid": "d037q2", "type": "single", "stem": "`EXPLAIN QUERY PLAN` 输出中出现 `SCAN orders` 表示什么？", "options": ["A  查询使用了覆盖索引，无需回表", "B  对 orders 做了全表扫描，条件没有命中可用索引", "C  查询命中了最左前缀", "D  查询结果被缓存，本次未真正执行"], "answer": "B", "explain": "`SCAN` 意味着逐行扫描整表；走索引定位时输出的是 `SEARCH ... USING INDEX`。看到 SCAN 就该检查条件是否跳过最左列、列上是否套了函数。"}, {"qid": "d037q3", "type": "judge", "stem": "在复合索引 (a, b, c) 上执行 `WHERE a = 1 AND b > 2 AND c = 3`，索引可以把 a、b、c 三列都用于定位。", "answer": false, "explain": "范围条件 b > 2 之后，c 只在每个 b 取值内部有序，整体不再全局有序，因此 c 只能作为过滤条件，索引定位只用到 a、b。"}, {"qid": "d037q4", "type": "fill", "stem": "创建索引的 SQL 语句形如 `CREATE ____ idx_name ON tbl (col);`，横线处填一个英文关键字。", "answer": ["INDEX", "index"], "explain": "语法是 `CREATE INDEX 索引名 ON 表名 (列名)`；`CREATE UNIQUE INDEX` 表示唯一索引。索引名要与表内已有索引区分开。"}, {"qid": "d037q5", "type": "code", "stem": "用标准库 sqlite3 写一个函数 `plan_uses_index(conn, sql)`：对传入的 SELECT 语句执行 `EXPLAIN QUERY PLAN`，读取 detail 列，若计划中出现走索引的访问方式则返回 True，否则返回 False（全表扫描属于 False）。6–10 行。", "answer": "def plan_uses_index(conn, sql):\n    \"\"\"sqlite3 下判断一条 SELECT 是否用上了索引。\"\"\"\n    rows = conn.execute(\"EXPLAIN QUERY PLAN \" + sql).fetchall()\n    details = [r[-1] for r in rows]          # 最后一列是 detail\n    return any(\"USING INDEX\" in d or \"USING COVERING INDEX\" in d for d in details)", "explain": "判分要点：必须真的执行 EXPLAIN QUERY PLAN 并读 detail 列，靠 `SCAN` / `SEARCH ... USING INDEX` 区分；用 PRAGMA 或硬编码返回不算。注意 `EXPLAIN QUERY PLAN` 前缀要与语句拼成一条 SQL。"}], "38": [{"qid": "d038q1", "type": "single", "stem": "同一事务内两次执行 `SELECT balance FROM accounts WHERE id = 1`，第二次读到的是另一个事务刚提交的新值。这属于哪种异常？", "options": ["A  脏读（dirty read）", "B  不可重复读（non-repeatable read）", "C  幻读（phantom read）", "D  丢失更新（lost update）"], "answer": "B", "explain": "读的是同一行的两次不同值，变化来自别人提交的 UPDATE，符合不可重复读。脏读读的是未提交数据；幻读是同一范围查询的行数变化。"}, {"qid": "d038q2", "type": "single", "stem": "关于隔离级别，下面哪一句正确？", "options": ["A  隔离级别越高，能避免的并发异常越多，但并发度通常越低", "B  隔离级别越高，并发度越高，异常越少", "C  READ COMMITTED 允许脏读", "D  SERIALIZABLE 无法避免幻读"], "answer": "A", "explain": "隔离性越强，检查与等待越多，冲突与开销也越多。READ COMMITTED 已禁止脏读；SERIALIZABLE 是最强级别，标准定义下三种读异常都不允许。"}, {"qid": "d038q3", "type": "judge", "stem": "数据库默认总是会阻止其他事务读到未提交的数据，所以未提交的中间状态在任何环境中都不会被发现。", "answer": false, "explain": "是否可见取决于隔离级别：READ UNCOMMITTED 明确允许脏读，也就是别的会话能读到未提交的修改。默认级别通常是 READ COMMITTED，但不等于所有环境都不会出现脏读。"}, {"qid": "d038q4", "type": "fill", "stem": "同一事务内两次执行同一范围查询，第二次因为别的事务新提交了 INSERT 而多出了行，这种现象称为 ____（填两字中文）。", "answer": ["幻读", "幻读现象"], "explain": "范围查询的行数因别人的 INSERT 而变化即幻读（phantom read）。它与不可重复读的区别在于变化来自「行数」而不是「同一行的值」。"}, {"qid": "d038q5", "type": "code", "stem": "用标准库 sqlite3 写函数 `transfer(conn, frm, to, amount, table=\"accounts\")`：从 frm 账户扣 amount、给 to 账户加 amount，扣款前要检查余额，余额不足则整笔不生效（回滚）并抛 ValueError，成功则提交。假设表结构为 `accounts(id, balance)`。5–10 行。", "answer": "def transfer(conn, frm, to, amount, table=\"accounts\"):\n    with conn:                      # 正常退出提交，抛异常自动回滚\n        cur = conn.cursor()\n        row = cur.execute(\n            f\"SELECT balance FROM {table} WHERE id = ?\", (frm,)\n        ).fetchone()\n        if row is None or row[0] < amount:\n            raise ValueError(\"insufficient balance\")\n        cur.execute(f\"UPDATE {table} SET balance = balance - ? WHERE id = ?\", (amount, frm))\n        cur.execute(f\"UPDATE {table} SET balance = balance + ? WHERE id = ?\", (amount, to))", "explain": "判分要点：两次 UPDATE 必须在同一事务内；异常路径要回滚（`with conn:` 或显式 rollback），不能只抛错还留下已扣款的中间状态；余额校验要发生在同一事务内、扣款之前。"}], "39": [{"qid": "d039q1", "type": "single", "stem": "某列表接口返回 50 条订单，SQL 日志显示该请求共执行了 51 条语句，最可能的原因是？", "options": ["A  连接池太小，发生了等待重试", "B  关联属性懒加载导致 N+1，每行触发一条查询", "C  事务隔离级别太高导致重复查询", "D  分页 offset 太深"], "answer": "B", "explain": "1 条主查询 + 50 条逐行的关联查询，条数随返回行数线性增长，是 N+1 的典型特征。连接池与隔离级别不会产生这种 1:N 的语句比例。"}, {"qid": "d039q2", "type": "single", "stem": "关于 IN 批量预加载的说法，哪一项正确？", "options": ["A  它把查询往返固定为 2 次，并且不放大结果行数", "B  它必须与 JOIN 一起使用才能生效", "C  它会返回重复的父对象，需要应用层去重", "D  它只适合一对一关联，一对多用不了"], "answer": "A", "explain": "先查父行、再用 `IN` 一次取回子行并在内存归组，往返次数与父行数无关。父对象重复是 JOIN 预加载放大行数时才需要处理的问题。"}, {"qid": "d039q3", "type": "judge", "stem": "把懒加载改成预加载总能让接口更快。", "answer": false, "explain": "预加载会一次拉回可能用不到的关联数据：关联很大时结果行数、传输量与内存占用都会上升。应该只预加载本次真正要展示的关联。"}, {"qid": "d039q4", "type": "fill", "stem": "一次主查询加上逐个对象触发的关联查询，这种反模式通常称为 ____ 问题（填英文形式，如 N+1）。", "answer": ["N+1", "n+1"], "explain": "即 N+1 查询问题：1 条主查询配上 N 条按对象逐条发出的关联查询。修法是预加载或批量取回后再归组。"}, {"qid": "d039q5", "type": "code", "stem": "用标准库 sqlite3 写函数 `load_items(conn, order_ids)`：表的关联查询为 `items(order_id, product)`。要求只发**一条** SQL 就取回全部订单的明细，返回 `{order_id: [product, ...]}`（没有明细的订单也要有键，值为空列表）。6–10 行。", "answer": "def load_items(conn, order_ids):\n    \"\"\"一条 IN 查询取回全部明细，返回 {order_id: [product, ...]}。\"\"\"\n    if not order_ids:\n        return {}\n    slots = \",\".join(\"?\" * len(order_ids))\n    rows = conn.execute(\n        f\"SELECT order_id, product FROM items WHERE order_id IN ({slots})\",\n        order_ids,\n    ).fetchall()\n    result = {oid: [] for oid in order_ids}\n    for order_id, product in rows:\n        result[order_id].append(product)\n    return result", "explain": "判分要点：必须是一条 IN 查询（占位符数量等于 id 个数，值通过参数传入，不能把 id 拼进 SQL），再在 Python 里按 order_id 归组；在循环里逐 id 查询就是 N+1，不得分。"}], "40": [{"qid": "d040q1", "type": "single", "stem": "旁路缓存（cache-aside）下，写入数据时推荐的操作顺序是？", "options": ["A  先更新缓存，再更新数据库", "B  先更新数据库，再删除缓存", "C  先删除缓存，再更新数据库", "D  只删除数据库，缓存交给 TTL 处理"], "answer": "B", "explain": "先写库保证数据落地，再删缓存让下次读回填新值。先删缓存会留下「读请求把旧值回填进来」的窗口；更新缓存则可能在并发写序错乱时留下旧值。"}, {"qid": "d040q2", "type": "single", "stem": "大批缓存 key 因为设置了相同 TTL 而在同一时刻集中失效，回源请求把数据库打满。这属于？", "options": ["A  缓存穿透", "B  缓存击穿", "C  缓存雪崩", "D  缓存污染"], "answer": "C", "explain": "大批 key 同时失效造成整体回源压力，是雪崩的定义。击穿指的是单个热点 key 失效瞬间的并发回源；穿透是查不存在的键导致缓存永不命中。"}, {"qid": "d040q3", "type": "judge", "stem": "缓存穿透的特点是：请求查的键在数据库里并不存在，缓存永远不命中，流量被直接压到数据库。", "answer": true, "explain": "这是穿透的典型表现，常见于恶意构造的随机 id。基础防护是参数校验、缓存空结果（短 TTL）以及布隆过滤器。"}, {"qid": "d040q4", "type": "fill", "stem": "为了让热点 key 失效瞬间只有一个请求回源查库、其余请求等待，通常要对回源操作加 ____（填中文手段名，如互斥锁或分布式锁）。", "answer": ["互斥锁", "分布式锁", "锁"], "explain": "回源加锁把并发查库收敛成一次，其余请求等待或短暂重试；另一种思路是逻辑过期 + 后台异步刷新，读请求先返回旧值。"}, {"qid": "d040q5", "type": "code", "stem": "用标准库写一个带 TTL 的旁路缓存读取函数 `get_cached(cache, key, loader, ttl, now=None)`：`cache` 形如 `{key: (value, expire_at)}`；命中且未过期直接返回缓存值，否则调用 `loader(key)` 回源、回填并返回。`now` 缺省用当前时间。5–10 行。", "answer": "import time\n\n\ndef get_cached(cache, key, loader, ttl, now=None):\n    \"\"\"旁路缓存读：命中未过期直接返回，否则回源、回填。\"\"\"\n    now = time.time() if now is None else now\n    hit = cache.get(key)\n    if hit is not None and hit[1] > now:\n        return hit[0]\n    value = loader(key)\n    cache[key] = (value, now + ttl)\n    return value", "explain": "判分要点：必须先查缓存并校验过期时间，只有未命中或已过期才调用 loader，回填时写入新的过期时间；无条件回源或只判断 key 是否存在而不看 TTL 不得分。"}], "41": [{"qid": "d041q1", "type": "single", "stem": "关于深分页，下面哪一项说法正确？", "options": ["A  LIMIT/OFFSET 的开销与 offset 大小无关，只与 LIMIT 有关", "B  LIMIT/OFFSET 需要沿索引走过被丢弃的 offset 行，偏移越大越慢", "C  只要偏移列上有索引，OFFSET 100000 与 OFFSET 20 一样快", "D  游标分页支持任意跳到第 N 页"], "answer": "B", "explain": "OFFSET 的语义是先取出再丢弃，被丢弃的行仍要读。索引只能减少单行读取成本，不能免除「走过 offset 行」这一步。游标分页恰恰不支持随机跳页。"}, {"qid": "d041q2", "type": "single", "stem": "游标分页（keyset pagination）能高效工作的前提是？", "options": ["A  用 OFFSET 记住位置，避免重复扫描", "B  排序键能构成全序，并且有对应索引使条件能定位起点", "C  表上不设主键，避免索引维护开销", "D  每翻一页都重新执行一次 COUNT 得到总数"], "answer": "B", "explain": "游标分页靠排序键条件在索引上定位起点，排序键不唯一会跳行或漏行（需补主键兜底），没有匹配索引就退化成扫描加排序。"}, {"qid": "d041q3", "type": "judge", "stem": "只要把逐条 INSERT 换成 executemany，批量插入就一定足够快，不需要再考虑事务粒度。", "answer": false, "explain": "executemany 减少的是语句条数；若不把它们放进同一个事务，每条语句仍各自提交与刷盘，提升有限。批量写入要同时做到一条语句多行 + 一个事务覆盖整批。"}, {"qid": "d041q4", "type": "fill", "stem": "用上一页最后一行的排序键作为下一页起点的分页方式，英文称为 keyset pagination，中文常称为 ____ 分页。", "answer": ["游标", "游标分页", "cursor"], "explain": "即游标分页，用游标（cursor）表示「读到哪里」而不是「第几页」。它的代价与页大小成正比，但不支持随机跳页。"}, {"qid": "d041q5", "type": "code", "stem": "用标准库 sqlite3 写函数 `fetch_page(conn, last_id, limit=20)`：按 id 升序做游标分页，返回二元组 `(rows, next_cursor)`，其中 `rows` 是 `(id, amount)` 列表；`last_id=0` 表示第一页；当返回行数等于 limit 时 `next_cursor` 取最后一行 id，否则为 None。5–10 行。", "answer": "def fetch_page(conn, last_id, limit=20):\n    \"\"\"按 id 升序的游标分页；last_id=0 表示第一页。\"\"\"\n    rows = conn.execute(\n        \"SELECT id, amount FROM orders WHERE id > ? ORDER BY id LIMIT ?\",\n        (last_id, limit),\n    ).fetchall()\n    next_cursor = rows[-1][0] if len(rows) == limit else None\n    return rows, next_cursor", "explain": "判分要点：必须用 `id > ?` 这类排序键条件定位起点，不能用 OFFSET；WHERE 的列要与 ORDER BY 一致；next_cursor 取最后一行的排序键，不足一页时返回 None。"}], "42": [{"qid": "d042q1", "type": "single", "stem": "表 `orders` 上已有索引 `idx_created (created_at)`，慢查询 `WHERE date(created_at) = '2026-11-01'` 用不上该索引。最直接的改写是？", "options": ["A  改成 `WHERE created_at >= '2026-11-01' AND created_at < '2026-11-02'`", "B  把隔离级别降到 READ UNCOMMITTED", "C  再建一个与 idx_created 相同的索引", "D  把结果缓存起来，不再动 SQL"], "answer": "A", "explain": "列上套函数会让索引键无法直接比较，改成对列的区间条件后索引才能定位起点。降隔离级别、重复建索引都改变不了扫描方式，加缓存只是把问题推到失效时。"}, {"qid": "d042q2", "type": "single", "stem": "列表接口返回 50 条记录，SQL 日志显示 51 条语句，其中 50 条形状相同、都是 `SELECT ... WHERE customer_id = ?`。首选动作是？", "options": ["A  用 IN 批量预加载，一条查询取回全部关联后在内存归组", "B  给这个接口加一层缓存，减少回源次数", "C  把隔离级别调低，减少锁等待", "D  把 LIMIT 分页改成 OFFSET 分页"], "answer": "A", "explain": "这是典型 N+1：问题在往返次数，预加载能把它从 51 次降到 2 次，是从根上消除。加缓存只是掩盖，缓存未命中时 N+1 依旧发生。"}, {"qid": "d042q3", "type": "judge", "stem": "旁路缓存（cache-aside）的写路径推荐「先更新数据库、再删除缓存」，而不是先删缓存再写库。", "answer": true, "explain": "先删缓存会留下一个读请求窗口：它查出旧值并回填，写库完成后缓存里仍是旧数据。先写库再删缓存把该窗口压到最小，删除操作本身也是幂等的。"}, {"qid": "d042q4", "type": "fill", "stem": "同一事务内两次读同一行拿到不同的值（期间别的事务提交了 UPDATE），这种读异常称为 ____（填中文术语）。", "answer": ["不可重复读", "不可重复读（non-repeatable read）"], "explain": "不可重复读（non-repeatable read）指同一行在事务内两次读到的值不同；READ COMMITTED 允许它，REPEATABLE READ 才禁止。"}, {"qid": "d042q5", "type": "code", "stem": "综合题：表结构为 `orders(id INTEGER PRIMARY KEY, user_id INTEGER, created_at TEXT)`，索引为 `(created_at, id)`。用标准库 sqlite3 写函数 `page_after(conn, last_created_at, last_id, limit=20)`，按 `created_at DESC, id DESC` 取严格小于游标的下一页，返回 `(id, user_id, created_at)` 列表。6–10 行。", "answer": "def page_after(conn, last_created_at, last_id, limit=20):\n    \"\"\"按 (created_at DESC, id DESC) 的游标分页，取严格小于游标的下一页。\"\"\"\n    return conn.execute(\n        \"SELECT id, user_id, created_at FROM orders \"\n        \"WHERE created_at < ? OR (created_at = ? AND id < ?) \"\n        \"ORDER BY created_at DESC, id DESC LIMIT ?\",\n        (last_created_at, last_created_at, last_id, limit),\n    ).fetchall()", "explain": "判分要点：必须是排序键比较而不是 OFFSET；created_at 可能重复，须用 id 兜底构成全序，只比 created_at 会跳行或漏行；WHERE 与 ORDER BY 的列要一致且走占位符传值。"}], "43": [{"qid": "d043q1", "type": "single", "stem": "下面哪种做法违反了分层架构的依赖方向约束？", "options": ["A  接口层（路由）调用业务层服务", "B  数据层 import 业务层的服务类来做业务判断", "C  业务层接收 repository 作为构造参数", "D  接口层不写业务规则，只解析请求并序列化响应"], "answer": "B", "explain": "依赖应单向流动：接口层→业务层→数据层。数据层反向依赖业务层会让持久化代码绑死业务规则，业务层也被迫跟着表结构变化，两层都无法单独替换。"}, {"qid": "d043q2", "type": "single", "stem": "某服务的 `OrderService` 在 `__init__` 里写成 `self.repo = OrderRepo()`。要让它能脱离数据库被单元测试，最直接的改法是？", "options": ["A  把 `OrderRepo` 改成单例，让所有测试共用同一个实例", "B  在构造函数签名里接收 `repo`（并提供默认实现），测试时传入内存假实现", "C  在测试文件里用 monkeypatch 替换掉 `OrderRepo` 类", "D  为测试单独复制一份 `OrderService` 代码，去掉数据库调用"], "answer": "B", "explain": "把依赖变成入参就是依赖注入：测试传入与真实接口一致的假实现即可，无需改动全局状态或复制代码。monkeypatch 只在依赖确实无法注入时使用。"}, {"qid": "d043q3", "type": "judge", "stem": "把数据库连接写成模块级全局变量，比通过参数注入更利于为业务层编写单元测试。", "answer": false, "explain": "全局连接把业务层与具体数据库绑死，测试必须准备真实连接或改动全局状态。依赖注入后可以传入内存假实现，测试更快也更稳定。"}, {"qid": "d043q4", "type": "fill", "stem": "在 FastAPI 中声明「该参数由依赖提供」使用 ____ 函数（填函数名，仅函数名）。", "answer": ["Depends"], "explain": "`Depends(get_repo)` 告诉框架先调用 `get_repo` 再把结果作为实参传入视图函数，依赖可以被整体覆盖，这也是测试时替换实现的入口。"}, {"qid": "d043q5", "type": "code", "stem": "写一个 `OrderService` 类：构造参数接收两个依赖——`repo`（有 `find(order_no)`，返回 `{\"due_at\": float}` 或 `None`）与 `clock`（无参可调用，返回当前时间戳）。实现 `is_overdue(order_no) -> bool`：订单不存在返回 `False`，否则当 `clock()` 大于 `due_at` 时返回 `True`。不要 import 任何第三方库。", "answer": "class OrderService:\n    def __init__(self, repo, clock):\n        self._repo = repo\n        self._clock = clock\n\n    def is_overdue(self, order_no):\n        order = self._repo.find(order_no)\n        if order is None:\n            return False\n        return self._clock() > order[\"due_at\"]", "explain": "判分要点：两个依赖必须由构造函数接收并保存，不能在方法内自己实例化或访问全局；不存在返回 `False`；比较用 `>` 而不是 `>=`。"}], "44": [{"qid": "d044q1", "type": "single", "stem": "在 FastAPI 中，请求体不符合 pydantic 模型约束（例如金额为负）时，框架默认返回的 HTTP 状态码是？", "options": ["A  200", "B  400", "C  422", "D  500"], "answer": "C", "explain": "请求已被成功解析但语义校验失败，FastAPI 默认返回 422 并给出字段级错误明细。400 留给请求本身无法解析的情况，500 属于服务端故障。"}, {"qid": "d044q2", "type": "single", "stem": "关于错误表达方式，下面哪一项设计是合理的？", "options": ["A  所有响应统一返回 200，业务失败靠 body 里的字符串文案区分", "B  用 HTTP 状态码表达协议级结果，同时在响应体里给出稳定的业务错误码，两者并存", "C  把数据库报错原文放进响应体，方便调用方定位", "D  每增加一种业务错误就发明一个新的 HTTP 状态码"], "answer": "B", "explain": "状态码让网关、监控、重试策略能做统一处理，业务错误码给调用方做精确分支。只返回 200 会丢掉监控能力，暴露原文则会泄露内部实现。"}, {"qid": "d044q3", "type": "judge", "stem": "声明 response_model 的作用之一是过滤出参字段，避免内部字段被意外返回给调用方。", "answer": true, "explain": "序列化会按响应模型声明的字段取值，模型里没写的字段不会出现在响应中，这既是契约也是防泄露的一层保险。"}, {"qid": "d044q4", "type": "fill", "stem": "在 FastAPI 中定义请求体结构时，模型类通常继承 ____ 基类（填类名）。", "answer": ["BaseModel"], "explain": "`from pydantic import BaseModel`，继承它之后字段标注会在运行时被校验，并成为 OpenAPI 文档里的 schema。"}, {"qid": "d044q5", "type": "code", "stem": "不使用第三方库，写一个函数 `parse_amount(raw)`：把 `raw` 转成整数，要求 `0 < amount <= 1000000`；转不成整数或超出范围时抛 `ValueError`，异常消息里要出现字段名 `amount`。3–8 行。", "answer": "def parse_amount(raw):\n    try:\n        amount = int(raw)\n    except (TypeError, ValueError):\n        raise ValueError(\"amount must be an integer\") from None\n    if not 0 < amount <= 1000000:\n        raise ValueError(\"amount out of range: %r\" % (amount,))\n    return amount", "explain": "判分要点：非法类型/字面量要转成 `ValueError`（不要漏掉 `TypeError` 这种输入），范围判断用链式比较，异常消息里包含 `amount` 以便定位字段。"}], "45": [{"qid": "d045q1", "type": "single", "stem": "下面哪一项最适合放进单元测试？", "options": ["A  验证某条 SQL 在真实 PostgreSQL 上是否命中索引", "B  验证折扣规则在不同订单金额区间下的计算结果", "C  验证调用第三方支付网关的连通性与超时重试", "D  验证镜像能否正常启动并监听端口"], "answer": "B", "explain": "折扣规则是纯计算逻辑，无 IO、无外部进程，是典型的单元测试对象。另外三项分别依赖真实数据库、外部网关与容器运行时，属于集成测试范围。"}, {"qid": "d045q2", "type": "single", "stem": "业务层需要读取一条订单记录，隔离数据库依赖最优先的做法是？", "options": ["A  在测试文件里 monkeypatch 掉全局的连接对象", "B  通过构造参数注入仓库，测试时传入内存假实现", "C  把这类用例标记为跳过，等集成环境再跑", "D  让测试连真实数据库，失败时自动重试三次"], "answer": "B", "explain": "依赖注入让替换点显式且局部，fake 行为可读、可并行。monkeypatch 全局对象是兜底手段，跳过等于不测，连真实库会拖慢并引入不稳定。"}, {"qid": "d045q3", "type": "judge", "stem": "单元测试应当尽量连接真实的数据库，这样才能保证测到真实行为。", "answer": false, "explain": "连真实数据库的是集成测试，用来发现契约与迁移问题。单元测试的价值在于快和稳定，真实依赖会让它变慢、变随机，无法在每次提交时都跑。"}, {"qid": "d045q4", "type": "fill", "stem": "线上缺陷修复后，应补一条最小复现用例防止再次出现，这类用例通常称为 ____ 测试（填中文词或英文词均可）。", "answer": ["回归", "regression", "regression test", "回归测试"], "explain": "回归测试保证已修复的问题不会在后续改动中复发，这也是“先加失败用例再修”这一顺序能长期省时的原因。"}, {"qid": "d045q5", "type": "code", "stem": "只用标准库，按下面的规则实现 `is_valid_order_no(value) -> bool`：必须是 `str`、长度在 6 到 32 之间、只含大写字母与数字。再用 `unittest.TestCase` 写两条用例：`\"AB1234\"` 为合法、`\"ab1234\"` 为非法。", "answer": "import unittest\n\n\ndef is_valid_order_no(value):\n    return (isinstance(value, str) and 6 <= len(value) <= 32\n            and value.isalnum() and value.isupper())\n\n\nclass TestOrderNo(unittest.TestCase):\n    def test_valid(self):\n        self.assertTrue(is_valid_order_no(\"AB1234\"))\n\n    def test_lowercase_rejected(self):\n        self.assertFalse(is_valid_order_no(\"ab1234\"))\n\n\nif __name__ == \"__main__\":\n    unittest.main()", "explain": "判分要点：先用 `isinstance` 挡住非字符串避免 `len` 报错；长度用链式比较；用 `isupper` 与 `isalnum` 组合表达“只含大写字母与数字”；两条用例分别覆盖合法与非法路径。"}], "46": [{"qid": "d046q1", "type": "single", "stem": "Dockerfile 中先 `COPY requirements.txt .` 装依赖、最后才 `COPY src/ ./src/`，主要好处是？", "options": ["A  满足 Docker 对 COPY 指令的字母序要求", "B  源码频繁变更时依赖安装层仍能命中缓存，重建更快", "C  减少镜像的层数，从而减小体积", "D  让容器启动时可以省略工作目录"], "answer": "B", "explain": "层缓存要求该指令及其之前的层都未变。源码放在最后一层，改代码只影响最后一层，装依赖这一耗时步骤继续复用缓存。层数并未因此减少。"}, {"qid": "d046q2", "type": "single", "stem": "关于多阶段构建，下面哪种描述是正确的用法？", "options": ["A  在最终镜像里保留编译器和构建脚本，方便进容器排查", "B  构建阶段安装编译工具与依赖，运行阶段只复制实际运行所需的产物", "C  两个阶段共享同一个基础镜像的 latest 标签，保证版本最新", "D  把 .git 目录也复制进最终镜像，用于保留版本信息"], "answer": "B", "explain": "多阶段构建的价值就是把构建期工具与运行期产物分开，最终镜像更小、攻击面更少。保留工具链、latest 漂移、带 .git 进镜像都与瘦身和可控性相悖。"}, {"qid": "d046q3", "type": "judge", "stem": "容器内进程默认以 root 身份运行，因此在生产镜像中创建非特权用户并切换是常见加固手段。", "answer": true, "explain": "以 root 运行意味着一旦进程被攻破，容器内文件系统与挂载卷的写权限都在攻击者手里。切换非特权用户是最小权限原则的基本落地。"}, {"qid": "d046q4", "type": "fill", "stem": "要让容器内的进程以非特权用户身份运行，需要在 Dockerfile 中写 `____ appuser`（填指令名，仅指令名）。", "answer": ["USER"], "explain": "`USER` 指令切换后续指令与容器的运行身份，一般先用 `RUN useradd --create-home appuser` 建好用户再 `
